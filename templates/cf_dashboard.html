<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF డాష్‌బోర్డ్ - రిపోర్ట్స్ డౌన్‌లోడ్</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Client-side OCR కోసం Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        .section-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            background-color: #f8fafc;
        }
        .section-header {
            font-size: 1rem;
            font-weight: 700;
            padding-bottom: 8px;
            margin-bottom: 14px;
            border-bottom: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dmy-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dmy-input {
            text-align: center;
        }
        .dmy-day, .dmy-month {
            max-width: 68px;
        }
        .dmy-year {
            max-width: 95px;
        }
        .scan-btn {
            white-space: nowrap;
            font-weight: 600;
        }
        .candidate-chip {
            cursor: pointer;
            font-size: 1.05rem;
            padding: 10px 16px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="bg-light">
    <!-- నెవ్‌బార్ -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand fw-bold">🏛️ CF పోర్టల్ - స్వాగతం, {{ cf_name }}</span>
        <button class="btn btn-outline-light btn-sm fw-bold" onclick="cfLogout()">లాగౌట్</button>
    </nav>

    <!-- రిపోర్ట్ డౌన్‌లోడ్ సెక్షన్ -->
    <div class="container my-5" style="max-width: 600px;">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <h4 class="fw-bold text-secondary mb-4 text-center">📥 మీ నెలవారీ రిపోర్ట్‌ని డౌన్‌లోడ్ చేసుకోండి</h4>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">నెలను ఎంచుకోండి (Select Month):</label>
                    <select name="month_number" id="month_select" class="form-select form-select-lg">
                        {% for m_num, m_name in months.items() %}
                        <option value="{{ m_num }}">Month {{ m_num }} ({{ m_name }})</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="row g-2">
                    <div class="col-md-6">
                        <button type="submit" formaction="/cf/download-report" class="btn btn-primary w-100 py-3 fw-bold shadow-sm">
                            📊 ఏరియా/నేమ్ వైజ్ రిపోర్ట్
                        </button>
                    </div>
                    <div class="col-md-6">
                        <button type="submit" formaction="/cf/download-report-allotted-bank" class="btn btn-success w-100 py-3 fw-bold shadow-sm">
                            🏦 బ్యాంక్ అలొకేషన్ వైజ్ రిపోర్ట్
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- ఆధార్ సెర్చ్ & డేటా ఎంట్రీ సెక్షన్ -->
    <div class="container my-4" style="max-width: 850px;">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
            <h4 class="fw-bold text-secondary mb-3 text-center">🔍 లబ్ధిదారుల ఆధార్ సెర్చ్ & డేటా ఎంట్రీ</h4>
            
            <div class="mb-3">
                <label class="form-label fw-semibold">బ్యాంక్ ఫైల్ పేరు ఎంచుకోండి (File Name):</label>
                <select id="file_name_select" class="form-select form-select-lg mb-3" onchange="onFileNameChanged()">
                    <option value="">-- ఫైల్ పేరును ఎంచుకోండి --</option>
                </select>
            </div>

            <!-- ఆధార్ సెర్చ్ ఇన్‌పుట్ కోడ్ మార్పు -->
            <div class="input-group mb-3">
                <input type="text" id="search_aadhar" class="form-control form-control-lg" placeholder="ఆధార్ నంబర్ ఎంటర్ చేయండి..." maxlength="12" oninput="this.value = this.value.replace(/[^0-9]/g, '')" onkeypress="if(event.key === 'Enter') searchAadhar();">
                <button class="btn btn-outline-primary px-3 fw-bold" type="button" onclick="triggerCameraScan('search_aadhar', 'Aadhar Number')">📷 స్కాన్</button>
                <button class="btn btn-primary px-4 fw-bold" onclick="searchAadhar()">సెర్చ్ చేయి</button>
            </div>
        </div>

        <!-- డైనమిక్ ఫారమ్ డిస్‌ప్లే అయ్యే ఏరియా -->
        <div id="form_container" class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="display: none;">
            <h5 id="form_title" class="fw-bold mb-3 text-primary"></h5>
            <form id="dynamic_beneficiary_form">
                <input type="hidden" id="action_type">
                <input type="hidden" id="row_index">
                
                <div id="form_fields_grid">
                    <!-- జావాస్క్రిప్ట్ ద్వారా 4 సెక్షన్లతో డైనమిక్ ఫీల్డ్స్ ఇక్కడ వస్తాయి -->
                </div>
                
                <div class="text-center mt-4">
                    <button type="button" class="btn btn-success px-5 py-2 fw-bold shadow-sm" onclick="saveBeneficiaryData()">సేవ్ / అప్‌డేట్ చేయి</button>
                </div>
            </form>
        </div>
    </div>

    <!-- దాచిన కెమెరా ఇన్‌పుట్ -->
    <input type="file" id="ocr_camera_input" accept="image/*" capture="environment" style="display: none;" onchange="handleCapturedImage(event)">

    <!-- స్కాన్ ఫలితాల Modal -->
    <div class="modal fade" id="ocrSelectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="ocrModalTitle">📷 స్కాన్ అవుతోంది...</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="ocrStatusBox" class="alert alert-info py-2 small mb-3 d-flex align-items-center gap-2">
                        <div class="spinner-border spinner-border-sm text-primary" id="ocrSpinner" role="status"></div>
                        <span id="ocrStatusText">ఫోటో నుండి వివరాలను ఆటోమేటిక్‌గా చదువుతోంది...</span>
                    </div>

                    <div id="ocrExtractedSummary" class="bg-light border rounded-3 p-3 mb-3 small" style="display: none;"></div>

                    <div id="ocrCandidatesSection" style="display: none;" class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">గుర్తించిన నంబర్లు (ఒక్క ట్యాప్‌తో ఫీల్డ్‌లో పడుతుంది):</label>
                        <div id="ocrCandidatesList" class="d-flex flex-wrap gap-2"></div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-semibold small text-secondary">సరిచూసుకోవడానికి / మార్చుకోవడానికి:</label>
                        <div class="input-group">
                            <input type="text" id="ocrManualPickInput" class="form-control form-control-lg fw-bold" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            <button type="button" class="btn btn-success fw-bold px-3" onclick="applyManualOcrValue()">ఫీల్డ్‌లో వేయి</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let fileIfscMap = {};
        let activeScanTarget = { element: null, fieldName: '' };
        let ocrModalInstance = null;

        // లబ్ధిదారుడు మరియు నామినీ కోసం వేర్వేరు పెండింగ్ ఆధార్ వివరాలు
        let pendingScannedAadhaarDetails = null;
        let pendingScannedNomineeDetails = null;

        const SCANNABLE_FIELDS = ['Aadhar Number', 'Bank Account Number', 'Contact Number', 'Nominee Aadhar'];

        // పేజీ లోడ్ అయిన వెంటనే బ్యాంక్ ఫైల్ నేమ్స్ మరియు వాటి IFSC కోడ్స్ లోడ్ చేయడం
        window.addEventListener('DOMContentLoaded', async () => {
            const modalEl = document.getElementById('ocrSelectModal');
            if (modalEl && window.bootstrap) {
                ocrModalInstance = new bootstrap.Modal(modalEl);
            }

            try {
                const res = await fetch('/cf/get-bank-files');
                const data = await res.json();
                if (data.status === 'success') {
                    fileIfscMap = data.file_ifsc_map || {};
                    const select = document.getElementById('file_name_select');
                    data.file_names.forEach(name => {
                        let opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        select.appendChild(opt);
                    });
                }
            } catch (e) {
                console.error("Error loading bank files", e);
            }
        });

        // కెమెరా ఓపెన్ చేసే ఫంక్షన్
        function triggerCameraScan(targetOrId, fieldName) {
            const el = typeof targetOrId === 'string' ? document.getElementById(targetOrId) : targetOrId;
            if (!el) {
                alert('టార్గెట్ ఫీల్డ్ కనుగొనబడలేదు.');
                return;
            }
            activeScanTarget = { element: el, fieldName: fieldName };
            const fileInput = document.getElementById('ocr_camera_input');
            fileInput.value = '';
            fileInput.click();
        }

        // ఇమేజ్‌ను రొటేట్ చేసి, హై-కాంట్రాస్ట్ గ్రేస్కేల్‌గా మార్చే హెల్పర్
        function buildProcessedCanvas(img, angleDeg) {
            const maxDim = 1500;
            const scale = Math.max(img.width, img.height) > maxDim ? (maxDim / Math.max(img.width, img.height)) : 1;
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);

            const canvas = document.createElement('canvas');
            if (angleDeg === 90 || angleDeg === 270) {
                canvas.width = h;
                canvas.height = w;
            } else {
                canvas.width = w;
                canvas.height = h;
            }

            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            if (angleDeg === 90) {
                ctx.translate(canvas.width, 0);
                ctx.rotate(Math.PI / 2);
            } else if (angleDeg === 270) {
                ctx.translate(0, canvas.height);
                ctx.rotate(-Math.PI / 2);
            }
            ctx.drawImage(img, 0, 0, w, h);
            ctx.restore();

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            const contrast = 1.4;
            const intercept = 128 * (1 - contrast);
            for (let i = 0; i < d.length; i += 4) {
                const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                const adj = Math.min(255, Math.max(0, gray * contrast + intercept));
                d[i] = d[i + 1] = d[i + 2] = adj;
            }
            ctx.putImageData(imgData, 0, 0);

            return canvas;
        }

        // "Government of India" లైన్ తర్వాత వచ్చే ఖచ్చితమైన పేరును వెలికితీసే ఫంక్షన్
        function extractAnchoredAadhaarName(lines) {
            const nonNameKeywords = /(government|india|unique|identification|authority|aadhaar|aadhar|year|birth|yob|dob|date|issue|male|female|transgender|camscanner|generated|भारत|सरकार|భారత|ప్రభుత్వం|ఆధార్|పుట్టిన|సంవత్సరం|గుర్తింపు)/i;

            let anchorIdx = -1;
            for (let i = 0; i < lines.length; i++) {
                if (/government\s*of\s*india|of\s*india/i.test(lines[i])) {
                    anchorIdx = i;
                    break;
                }
            }

            // "Government of India" తర్వాత 1 నుండి 5 లైన్లలోపు పేరు ఉంటుంది
            const startIdx = anchorIdx >= 0 ? anchorIdx + 1 : 0;
            const endIdx = anchorIdx >= 0 ? Math.min(lines.length, anchorIdx + 6) : lines.length;

            for (let i = startIdx; i < endIdx; i++) {
                const ln = lines[i];
                if (nonNameKeywords.test(ln)) continue;
                if (/\d/.test(ln)) continue;

                const cleaned = ln.replace(/[^A-Za-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
                const words = cleaned.split(' ').filter(w => w.length >= 2);

                // కనీసం 2 పదాలు (ఉదా: "Gajula Himansh" లేదా "Bheemanathini Kavitha") ఉండాలి
                if (words.length >= 2 && words.length <= 4 && /^[A-Za-z\s]+$/.test(cleaned) && cleaned.length >= 6 && cleaned.length <= 40) {
                    return cleaned.toUpperCase();
                }
            }

            return '';
        }

        // ఆధార్ OCR టెక్స్ట్ నుండి పేరు, పుట్టిన సంవత్సరం / తేదీ మరియు ఆధార్ నంబర్‌లను వెలికితీసే ఫంక్షన్
        function parseAadhaarDetailsFromText(rawText, fieldName) {
            const spacedAadhaar = [];
            const generalNumbers = new Set();

            // 1. 4-4-4 ఆధార్ నంబర్ ప్యాటర్న్
            const aadhaarPattern = /\b(\d{4})[\s\-]+(\d{4})[\s\-]+(\d{4})\b/g;
            let match;
            while ((match = aadhaarPattern.exec(rawText)) !== null) {
                const clean12 = `${match[1]}${match[2]}${match[3]}`;
                if (!spacedAadhaar.includes(clean12)) {
                    spacedAadhaar.push(clean12);
                }
                generalNumbers.add(clean12);
            }

            const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            for (const line of lines) {
                const lineSpaced = line.replace(/[^0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
                const mLine = lineSpaced.match(/\b(\d{4})\s+(\d{4})\s+(\d{4})\b/);
                if (mLine) {
                    const c = `${mLine[1]}${mLine[2]}${mLine[3]}`;
                    if (!spacedAadhaar.includes(c)) spacedAadhaar.push(c);
                    generalNumbers.add(c);
                }
                const groups = line.match(/\d{6,18}/g) || [];
                groups.forEach(g => generalNumbers.add(g));
            }

            // 2. పుట్టిన సంవత్సరం (Year of Birth) లేదా పూర్తి DOB వెలికితీయడం (Issue Date ను DOB గా తీసుకోకుండా జాగ్రత్త)
            let yob = '';
            let dobFull = null;

            for (const line of lines) {
                if (/issue\s*date/i.test(line)) continue;
                const dMatch = line.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})\b/);
                if (dMatch) {
                    const dNum = parseInt(dMatch[1], 10);
                    const mNum = parseInt(dMatch[2], 10);
                    const yNum = parseInt(dMatch[3], 10);
                    if (dNum >= 1 && dNum <= 31 && mNum >= 1 && mNum <= 12 && yNum >= 1915 && yNum <= 2025) {
                        dobFull = {
                            dd: String(dNum).padStart(2, '0'),
                            mm: String(mNum).padStart(2, '0'),
                            yyyy: String(yNum)
                        };
                        yob = String(yNum);
                        break;
                    }
                }
            }

            if (!yob) {
                for (const line of lines) {
                    if (/issue\s*date/i.test(line)) continue;
                    if (/year\s*of\s*birth|yob|birth|dob|సంవత్సరం|పుట్టిన/i.test(line)) {
                        const yrMatch = line.match(/\b(19\d{2}|20\d{2})\b/);
                        if (yrMatch) {
                            const yCandidate = parseInt(yrMatch[1], 10);
                            if (yCandidate >= 1915 && yCandidate <= 2025) {
                                yob = String(yCandidate);
                                break;
                            }
                        }
                    }
                }
            }

            // 3. పేరు వెలికితీయడం
            const extractedName = extractAnchoredAadhaarName(lines);

            let numbers = Array.from(generalNumbers);
            let exact = false;

            if (fieldName === 'Aadhar Number' || fieldName === 'Nominee Aadhar') {
                if (spacedAadhaar.length > 0) {
                    numbers = spacedAadhaar;
                    exact = true;
                } else {
                    const exact12 = numbers.filter(n => n.length === 12);
                    if (exact12.length > 0) {
                        numbers = exact12;
                        exact = true;
                    }
                }
            } else if (fieldName === 'Contact Number') {
                const exact10 = numbers.filter(n => n.length === 10);
                if (exact10.length > 0) {
                    numbers = exact10;
                    exact = true;
                }
            } else if (fieldName === 'Bank Account Number') {
                const accounts = numbers.filter(n => n.length >= 9 && n.length <= 18);
                if (accounts.length > 0) {
                    numbers = accounts;
                    exact = true;
                }
            }

            return {
                exact,
                numbers,
                name: extractedName,
                yob,
                dobFull
            };
        }

        // కెమెరా ఫోటో తీయగానే ఆటోమేటిక్‌గా 0°, 90°, 270° కోణాల్లో స్కాన్ చేసే ఫంక్షన్
        async function handleCapturedImage(event) {
            const file = event.target.files && event.target.files[0];
            if (!file || !activeScanTarget.element) return;

            const fieldName = activeScanTarget.fieldName;
            const isNomineeScan = (fieldName === 'Nominee Aadhar');
            const isBeneficiaryAadhaarScan = (fieldName === 'Aadhar Number');

            if (isNomineeScan) {
                pendingScannedNomineeDetails = null;
            } else if (isBeneficiaryAadhaarScan) {
                pendingScannedAadhaarDetails = null;
            }

            document.getElementById('ocrModalTitle').textContent = `📷 ${fieldName} స్కాన్`;
            document.getElementById('ocrStatusBox').className = 'alert alert-info py-2 small mb-3 d-flex align-items-center gap-2';
            document.getElementById('ocrSpinner').style.display = 'inline-block';
            document.getElementById('ocrStatusText').textContent = 'ఫోటో నుండి వివరాలను ఆటోమేటిక్‌గా చదువుతోంది...';
            document.getElementById('ocrExtractedSummary').style.display = 'none';
            document.getElementById('ocrCandidatesSection').style.display = 'none';
            document.getElementById('ocrCandidatesList').innerHTML = '';
            document.getElementById('ocrManualPickInput').value = '';

            if (ocrModalInstance) {
                ocrModalInstance.show();
            }

            const img = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const imageObj = new Image();
                    imageObj.onload = () => resolve(imageObj);
                    imageObj.onerror = reject;
                    imageObj.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            }).catch(() => null);

            if (!img) {
                document.getElementById('ocrSpinner').style.display = 'none';
                document.getElementById('ocrStatusBox').className = 'alert alert-danger py-2 small mb-3';
                document.getElementById('ocrStatusText').textContent = 'ఫోటో లోడ్ చేయడంలో సమస్య వచ్చింది.';
                return;
            }

            let worker = null;
            try {
                worker = await Tesseract.createWorker('eng');
                const anglesToTry = [0, 90, 270];
                let bestParsed = { exact: false, numbers: [], name: '', yob: '', dobFull: null };
                const collectedNumbers = new Set();

                for (const angle of anglesToTry) {
                    const processedCanvas = buildProcessedCanvas(img, angle);
                    const ret = await worker.recognize(processedCanvas);
                    const rawText = (ret && ret.data && ret.data.text) ? ret.data.text : '';
                    const parsed = parseAadhaarDetailsFromText(rawText, fieldName);

                    parsed.numbers.forEach(n => collectedNumbers.add(n));

                    if (!bestParsed.name && parsed.name) bestParsed.name = parsed.name;
                    if (!bestParsed.yob && parsed.yob) bestParsed.yob = parsed.yob;
                    if (!bestParsed.dobFull && parsed.dobFull) bestParsed.dobFull = parsed.dobFull;

                    if (parsed.exact && parsed.numbers.length > 0) {
                        bestParsed.numbers = parsed.numbers;
                        bestParsed.exact = true;
                        if (bestParsed.name && bestParsed.yob) {
                            break;
                        }
                    }
                }

                await worker.terminate();
                worker = null;

                document.getElementById('ocrSpinner').style.display = 'none';

                const finalNumbers = bestParsed.numbers.length > 0 ? bestParsed.numbers : Array.from(collectedNumbers);
                const isAadhaarScan = (isBeneficiaryAadhaarScan || isNomineeScan);

                if (isAadhaarScan && (bestParsed.name || bestParsed.yob)) {
                    const detailsObj = {
                        name: bestParsed.name,
                        yob: bestParsed.yob,
                        dobFull: bestParsed.dobFull
                    };

                    if (isNomineeScan) {
                        pendingScannedNomineeDetails = detailsObj;
                        applyNomineeDetailsToForm(pendingScannedNomineeDetails);
                    } else {
                        pendingScannedAadhaarDetails = detailsObj;
                        applyAadhaarDetailsToForm(pendingScannedAadhaarDetails);
                    }

                    const roleLabel = isNomineeScan ? 'నామినీ' : 'లబ్ధిదారుని';
                    const summaryBox = document.getElementById('ocrExtractedSummary');
                    summaryBox.style.display = 'block';
                    summaryBox.innerHTML = `
                        <div class="fw-bold text-success mb-1">✅ ఆటోమేటిక్‌గా గుర్తించిన ${roleLabel} వివరాలు:</div>
                        ${bestParsed.name ? `<div><strong>పేరు:</strong> ${bestParsed.name}</div>` : ''}
                        ${bestParsed.yob ? `<div><strong>పుట్టిన సంవత్సరం / తేదీ:</strong> ${bestParsed.dobFull ? `${bestParsed.dobFull.dd}/${bestParsed.dobFull.mm}/${bestParsed.dobFull.yyyy}` : bestParsed.yob}</div>` : ''}
                    `;
                }

                if (bestParsed.exact && finalNumbers.length === 1) {
                    selectScannedNumber(finalNumbers[0]);
                    return;
                }

                if (finalNumbers.length > 0) {
                    document.getElementById('ocrStatusBox').className = 'alert alert-success py-2 small mb-3';
                    document.getElementById('ocrStatusText').textContent = 'కింది నంబర్లలో సరైన దానిపై ఒక్కసారి ట్యాప్ చేయండి:';
                    document.getElementById('ocrCandidatesSection').style.display = 'block';
                    document.getElementById('ocrManualPickInput').value = finalNumbers[0];

                    const listContainer = document.getElementById('ocrCandidatesList');
                    finalNumbers.forEach(num => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'btn btn-outline-primary candidate-chip fw-bold';
                        btn.textContent = num.length === 12 ? `${num.slice(0,4)} ${num.slice(4,8)} ${num.slice(8,12)}` : num;
                        btn.onclick = () => selectScannedNumber(num);
                        listContainer.appendChild(btn);
                    });
                } else {
                    document.getElementById('ocrStatusBox').className = 'alert alert-warning py-2 small mb-3';
                    document.getElementById('ocrStatusText').textContent = 'నంబర్ స్పష్టంగా కనబడలేదు. దగ్గరగా, వెలుతురులో మళ్లీ ఫోటో తీయండి లేదా కింద టైప్ చేయండి.';
                }
            } catch (err) {
                if (worker) {
                    try { await worker.terminate(); } catch (_) {}
                }
                document.getElementById('ocrSpinner').style.display = 'none';
                document.getElementById('ocrStatusBox').className = 'alert alert-danger py-2 small mb-3';
                document.getElementById('ocrStatusText').textContent = 'స్కాన్ చేయడంలో సమస్య వచ్చింది. మళ్లీ ప్రయత్నించండి.';
            }
        }

        // లబ్ధిదారుని పేరు మరియు పుట్టిన సంవత్సరం/తేదీని ఫారమ్ ఫీల్డ్స్‌లో నింపే ఫంక్షన్
        function applyAadhaarDetailsToForm(details) {
            if (!details) return;
            const form = document.getElementById('dynamic_beneficiary_form');
            if (!form) return;

            if (details.name) {
                const nameInput = form.querySelector('input[name="Name Of Benificiary"]');
                if (nameInput) {
                    nameInput.value = details.name;
                    nameInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }

            if (details.dobFull || details.yob) {
                const safeKey = 'Date_OF_Birth';
                const ddEl = document.getElementById(`dmy_dd_${safeKey}`);
                const mmEl = document.getElementById(`dmy_mm_${safeKey}`);
                const yyyyEl = document.getElementById(`dmy_yyyy_${safeKey}`);

                if (details.dobFull) {
                    if (ddEl) ddEl.value = details.dobFull.dd;
                    if (mmEl) mmEl.value = details.dobFull.mm;
                    if (yyyyEl) yyyyEl.value = details.dobFull.yyyy;
                } else if (details.yob && yyyyEl) {
                    yyyyEl.value = details.yob;
                }

                handleDmyInput(safeKey, true);
            }
        }

        // నామినీ పేరు మరియు నామినీ DOB ను ఫారమ్ ఫీల్డ్స్‌లో నింపే ఫంక్షన్
        function applyNomineeDetailsToForm(details) {
            if (!details) return;
            const form = document.getElementById('dynamic_beneficiary_form');
            if (!form) return;

            if (details.name) {
                const nomineeNameInput = form.querySelector('input[name="Nominee Name"]');
                if (nomineeNameInput) {
                    nomineeNameInput.value = details.name;
                    nomineeNameInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }

            if (details.dobFull || details.yob) {
                const safeKey = 'Nominee_DOB';
                const ddEl = document.getElementById(`dmy_dd_${safeKey}`);
                const mmEl = document.getElementById(`dmy_mm_${safeKey}`);
                const yyyyEl = document.getElementById(`dmy_yyyy_${safeKey}`);

                if (details.dobFull) {
                    if (ddEl) ddEl.value = details.dobFull.dd;
                    if (mmEl) mmEl.value = details.dobFull.mm;
                    if (yyyyEl) yyyyEl.value = details.dobFull.yyyy;
                } else if (details.yob && yyyyEl) {
                    yyyyEl.value = details.yob;
                }

                handleDmyInput(safeKey, false);
            }
        }

        // ఎంచుకున్న నంబర్‌ను టార్గెట్ ఇన్‌పుట్ ఫీల్డ్‌లోకి వేయడం
        function selectScannedNumber(numStr) {
            const cleanNum = String(numStr || '').replace(/[^0-9]/g, '');
            if (!activeScanTarget.element || !cleanNum) return;

            activeScanTarget.element.value = cleanNum;
            activeScanTarget.element.dispatchEvent(new Event('input', { bubbles: true }));
            activeScanTarget.element.dispatchEvent(new Event('change', { bubbles: true }));

            if (ocrModalInstance) {
                ocrModalInstance.hide();
            }
        }

        function applyManualOcrValue() {
            const val = document.getElementById('ocrManualPickInput').value;
            selectScannedNumber(val);
        }

        // File Name మారినప్పుడు ఫారమ్‌లోని IFSC code మరియు FILE NAME ను ఆటోమేటిక్‌గా అప్‌డేట్ చేయడం
        function onFileNameChanged() {
            const selectedFile = document.getElementById('file_name_select').value;
            const autoIfsc = (selectedFile && fileIfscMap[selectedFile]) ? fileIfscMap[selectedFile] : '';

            const ifscInput = document.querySelector('#dynamic_beneficiary_form input[name="IFSC code"]');
            if (ifscInput && autoIfsc) {
                ifscInput.value = autoIfsc;
            }

            const fileInput = document.querySelector('#dynamic_beneficiary_form input[name="FILE NAME"]');
            if (fileInput && selectedFile) {
                fileInput.value = selectedFile;
            }
        }

        // ఆధార్ సెర్చ్ ఫంక్షన్
        async function searchAadhar() {
            const fileName = document.getElementById('file_name_select').value;
            if (!fileName) {
                alert('దయచేసి ముందుగా బ్యాంక్ ఫైల్ పేరు (File Name) ఎంచుకోండి!');
                return;
            }

            const aadhar = document.getElementById('search_aadhar').value.trim();
            if (!aadhar || aadhar.length !== 12) {
                alert('దయచేసి సరైన 12 అంకెల ఆధార్ నంబర్ ఎంటర్ చేయండి!');
                return;
            }

            try {
                const response = await fetch('/cf/search-beneficiary', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({aadhar_number: aadhar, file_name: fileName})
                });
                const result = await response.json();

                if (result.status === 'existing') {
                    document.getElementById('form_title').innerHTML = `<span class="text-success">📋 రికార్డు కనుగొనబడింది - ఇది అప్‌డేట్ (Update) అవుతుంది</span>`;
                    document.getElementById('action_type').value = 'update';
                    document.getElementById('row_index').value = result.row_index || '';
                    buildFormFields(result.columns, result.data, aadhar, result.dropdown_data, result.auto_ifsc);
                } else if (result.status === 'new') {
                    document.getElementById('form_title').innerHTML = `<span class="text-primary">➕ ఇది కొత్త ఎంట్రీ (New Entry) కింద సేవ్ అవుతుంది. వివరాలు సరిచూసుకొని మార్పులు చేయవచ్చు.</span>`;
                    document.getElementById('action_type').value = 'insert';
                    document.getElementById('row_index').value = '';
                    buildFormFields(result.columns, result.data, aadhar, result.dropdown_data, result.auto_ifsc);
                } else {
                    alert(result.message || 'ఏదో లోపం జరిగింది!');
                }

                if (pendingScannedAadhaarDetails) {
                    applyAadhaarDetailsToForm(pendingScannedAadhaarDetails);
                }
                if (pendingScannedNomineeDetails) {
                    applyNomineeDetailsToForm(pendingScannedNomineeDetails);
                }

                document.getElementById('form_container').style.display = 'block';
                document.getElementById('form_container').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                alert('సర్వర్‌ను కనెక్ట్ చేయడంలో సమస్య ఏర్పడింది.');
            }
        }

        // ఏ తేదీ ఫార్మట్ నుంచైనా (YYYY-MM-DD లేదా DD/MM/YYYY) {dd, mm, yyyy} వేరు చేసే హెల్పర్
        function parseDateParts(val) {
            if (!val) return { dd: '', mm: '', yyyy: '' };
            const s = String(val).trim().split(' ')[0];

            let m1 = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
            if (m1) {
                return {
                    yyyy: m1[1],
                    mm: m1[2].padStart(2, '0'),
                    dd: m1[3].padStart(2, '0')
                };
            }

            let m2 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
            if (m2) {
                return {
                    dd: m2[1].padStart(2, '0'),
                    mm: m2[2].padStart(2, '0'),
                    yyyy: m2[3]
                };
            }

            return { dd: '', mm: '', yyyy: '' };
        }

        // DD / MM / YYYY ఫార్మట్‌లో సులభంగా ఎంటర్ చేయడానికి ఇన్‌పుట్ HTML తయారు చేయడం
        function createDateDmyHtml(colName, val) {
            const safeKey = colName.replace(/[^a-zA-Z0-9]/g, '_');
            const parts = parseDateParts(val);
            const onChangeHook = (colName === 'Date OF Birth') ? `oninput="handleDmyInput('${safeKey}', true)"` : `oninput="handleDmyInput('${safeKey}', false)"`;

            return `
                <div class="dmy-group" data-dmy-col="${colName}" id="dmy_group_${safeKey}">
                    <input type="text" class="form-control dmy-input dmy-day" id="dmy_dd_${safeKey}" value="${parts.dd}" placeholder="DD" maxlength="2" ${onChangeHook}>
                    <span class="fw-bold text-muted">/</span>
                    <input type="text" class="form-control dmy-input dmy-month" id="dmy_mm_${safeKey}" value="${parts.mm}" placeholder="MM" maxlength="2" ${onChangeHook}>
                    <span class="fw-bold text-muted">/</span>
                    <input type="text" class="form-control dmy-input dmy-year" id="dmy_yyyy_${safeKey}" value="${parts.yyyy}" placeholder="YYYY" maxlength="4" ${onChangeHook}>
                </div>
                <div class="form-text text-muted" style="font-size: 0.72rem;">డే / మంత్ / ఇయర్ (ఉదా: 15 / 08 / 1990)</div>
            `;
        }

        function handleDmyInput(safeKey, isMainDob) {
            const ddEl = document.getElementById(`dmy_dd_${safeKey}`);
            const mmEl = document.getElementById(`dmy_mm_${safeKey}`);
            const yyyyEl = document.getElementById(`dmy_yyyy_${safeKey}`);

            if (ddEl) ddEl.value = ddEl.value.replace(/[^0-9]/g, '');
            if (mmEl) mmEl.value = mmEl.value.replace(/[^0-9]/g, '');
            if (yyyyEl) yyyyEl.value = yyyyEl.value.replace(/[^0-9]/g, '');

            if (isMainDob && yyyyEl && yyyyEl.value.length === 4) {
                const dobYear = parseInt(yyyyEl.value, 10);
                const currentYear = new Date().getFullYear();
                const ageInput = document.getElementById('age_input');
                if (ageInput && !isNaN(dobYear) && dobYear >= 1900 && dobYear <= currentYear) {
                    ageInput.value = currentYear - dobYear;
                }
            }
        }

        function readDmyAsIso(colName) {
            const safeKey = colName.replace(/[^a-zA-Z0-9]/g, '_');
            const ddRaw = (document.getElementById(`dmy_dd_${safeKey}`)?.value || '').trim();
            const mmRaw = (document.getElementById(`dmy_mm_${safeKey}`)?.value || '').trim();
            const yyyyRaw = (document.getElementById(`dmy_yyyy_${safeKey}`)?.value || '').trim();

            if (!ddRaw && !mmRaw && !yyyyRaw) {
                return { valid: true, isoValue: '', isEmpty: true };
            }

            const day = parseInt(ddRaw, 10);
            const month = parseInt(mmRaw, 10);
            const year = parseInt(yyyyRaw, 10);

            if (
                isNaN(day) || day < 1 || day > 31 ||
                isNaN(month) || month < 1 || month > 12 ||
                isNaN(year) || yyyyRaw.length !== 4 || year < 1900 || year > 2100
            ) {
                return { valid: false, isoValue: '', isEmpty: false };
            }

            const checkDate = new Date(year, month - 1, day);
            if (
                checkDate.getFullYear() !== year ||
                checkDate.getMonth() !== (month - 1) ||
                checkDate.getDate() !== day
            ) {
                return { valid: false, isoValue: '', isEmpty: false };
            }

            const ddStr = String(day).padStart(2, '0');
            const mmStr = String(month).padStart(2, '0');
            const yyyyStr = String(year).padStart(4, '0');

            return { valid: true, isoValue: `${yyyyStr}-${mmStr}-${ddStr}`, isEmpty: false };
        }

        // ప్రతి కాలమ్‌కు తగిన ఇన్‌పుట్ HTML తయారు చేసే హెల్పర్
        function createFieldHtml(col, data, aadhar, dropdowns, autoIfsc) {
            let val = (data && data[col] !== undefined && data[col] !== null) ? data[col] : '';
            if (col === 'Aadhar Number') val = aadhar;
            if (col === 'IFSC code') {
                const selectedFile = document.getElementById('file_name_select').value;
                const mappedIfsc = autoIfsc || (selectedFile && fileIfscMap[selectedFile]) || '';
                if (mappedIfsc) val = mappedIfsc;
            }

            const districts = ['RAJANNA SIRCILLA', 'HYDERABAD', 'KARIMNAGAR', 'WARANGAL', 'NIZAMABAD', 'KHAMMAM', 'NALGONDA', 'MEDAK', 'ADILABAD', 'MAHABUBNAGAR', 'RANGAREDDY', 'SANGAREDDY', 'SIDDIPET', 'JAGTIAL', 'PEDDAPALLI', 'KAMARREDDY'];
            const mandals = {
                'RAJANNA SIRCILLA': ['SIRCILLA', 'YELLAREDDIPET', 'MUSTABAD', 'GAMBHIRAOPET', 'VEERANAPET', 'ELLANTHAKUNTA', 'BOINPALLE', 'THANGALLAPALLY', 'CHANDURTHY', 'RUDRANGI', 'MEERPET']
            };
            const wageOptions = [200, 300, 500, 600, 700, 800, 1000, 1200];

            let inputHtml = '';

            if (col === 'Profession') {
                let optionsList = dropdowns && dropdowns.professions ? [...dropdowns.professions] : ['POWER LOOM WEAVER'];
                if (!optionsList.includes('POWER LOOM WEAVER')) optionsList.unshift('POWER LOOM WEAVER');
                inputHtml = `<select class="form-select" name="${col}">`;
                optionsList.forEach(item => {
                    let sel = (val === item || (!val && item === 'POWER LOOM WEAVER')) ? 'selected' : '';
                    inputHtml += `<option value="${item}" ${sel}>${item}</option>`;
                });
                inputHtml += `</select>`;
            }
            else if (col === 'DISTRICT NAME') {
                inputHtml = `<select class="form-select" id="district_select" name="${col}">`;
                districts.forEach(d => {
                    let sel = (val === d || (!val && d === 'RAJANNA SIRCILLA')) ? 'selected' : '';
                    inputHtml += `<option value="${d}" ${sel}>${d}</option>`;
                });
                inputHtml += `</select>`;
            }
            else if (col === 'MANDAL NAME') {
                inputHtml = `<select class="form-select" id="mandal_select" name="${col}">`;
                let mList = mandals['RAJANNA SIRCILLA'] || ['SIRCILLA'];
                mList.forEach(m => {
                    let sel = (val === m || (!val && m === 'SIRCILLA')) ? 'selected' : '';
                    inputHtml += `<option value="${m}" ${sel}>${m}</option>`;
                });
                inputHtml += `</select>`;
            }
            else if (col === 'Caste') {
                if (!val) val = 'BC';
                inputHtml = `<input type="text" class="form-control" name="${col}" value="${val}">`;
            }
            else if (col === '8% Of Monthly Wages') {
                if (!val) val = 1200;
                inputHtml = `<select class="form-select" id="eight_percent_wages" name="${col}" onchange="updateMonthlyWages(this.value)">`;
                wageOptions.forEach(w => {
                    let sel = (Number(val) === Number(w)) ? 'selected' : '';
                    inputHtml += `<option value="${w}" ${sel}>${w}</option>`;
                });
                inputHtml += `</select>`;
            }
            else if (col === 'MONTHLY WAGES') {
                if (!val && data['8% Of Monthly Wages']) val = Number(data['8% Of Monthly Wages']) * 100 / 8;
                inputHtml = `<input type="text" class="form-control bg-light" id="monthly_wages_input" name="${col}" value="${val}" readonly>`;
            }
            else if (col === 'Date OF Birth' || col === 'Nominee DOB') {
                inputHtml = createDateDmyHtml(col, val);
            }
            else if (col === 'Age') {
                inputHtml = `<input type="text" class="form-control bg-light" id="age_input" name="${col}" value="${val}" readonly>`;
            }
            else if (['Village', 'Area', 'Unit Owner', 'H.NO. Unit H.No', 'Relation', 'VILLAGE NAME'].includes(col)) {
                let datalistId = `list_${col.replace(/[^a-zA-Z0-9]/g, '_')}`;
                let suggestions = [];
                if (col === 'Village' || col === 'VILLAGE NAME') suggestions = dropdowns.villages;
                else if (col === 'Area') suggestions = dropdowns.areas;
                else if (col === 'Unit Owner') suggestions = dropdowns.unit_owners;
                else if (col === 'H.NO. Unit H.No') suggestions = dropdowns.unit_hns;
                else if (col === 'Relation') suggestions = dropdowns.relations;

                inputHtml = `<input type="text" class="form-control" name="${col}" value="${val}" list="${datalistId}">`;
                inputHtml += `<datalist id="${datalistId}">`;
                if (suggestions) {
                    suggestions.forEach(s => {
                        inputHtml += `<option value="${s}">`;
                    });
                }
                inputHtml += `</datalist>`;
            }
            else if (SCANNABLE_FIELDS.includes(col)) {
                const maxLen = (col === 'Aadhar Number' || col === 'Nominee Aadhar') ? 12 : (col === 'Contact Number' ? 10 : 18);
                inputHtml = `
                    <div class="input-group">
                        <input type="text" class="form-control" name="${col}" value="${val}" maxlength="${maxLen}" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        <button type="button" class="btn btn-outline-primary scan-btn" onclick="triggerCameraScan(this.previousElementSibling, '${col}')">📷 స్కాన్</button>
                    </div>
                `;
            }
            else if (['BANK SENT', 'BANK_SNO', 'EMAIL ID', 'NAME OF CF', 'Bank Name', 'IFSC code', 'FILE NAME'].includes(col)) {
                inputHtml = `<input type="text" class="form-control bg-light" name="${col}" value="${val}" readonly>`;
            }
            else {
                inputHtml = `<input type="text" class="form-control" name="${col}" value="${val}">`;
            }

            return `
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold text-secondary small">${col}</label>
                    ${inputHtml}
                </div>
            `;
        }

        // 4 సెక్షన్లతో డైనమిక్ ఫారమ్ నిర్మించే ఫంక్షన్
        function buildFormFields(columns, data, aadhar, dropdowns, autoIfsc = '') {
            const grid = document.getElementById('form_fields_grid');
            grid.innerHTML = '';

            const sections = [
                {
                    id: 'aadhar_section',
                    title: '🪪 ఆధార్ కార్డ్ డేటా సెక్షన్ (Aadhaar Card Data Section)',
                    headerClass: 'text-primary',
                    fields: [
                        'Name Of Benificiary', 'Father Name', 'Date OF Birth', 'Age',
                        'Aadhar Number',
                        'DISTRICT NAME', 'MANDAL NAME', 'VILLAGE NAME', 'H.NO. Residentional H.No'
                    ]
                },
                {
                    id: 'working_area_section',
                    title: '🏭 వర్కింగ్ ఏరియా సెక్షన్ (Working Area Section)',
                    headerClass: 'text-success',
                    fields: [
                        'Caste', 'Profession', 'Contact Number', 'Village', 'Area', 'H.NO. Unit H.No', 'Unit Owner',
                        'GEO TAG NUMBER', '8% Of Monthly Wages', 'MONTHLY WAGES', 'NAME OF CF'
                    ]
                },
                {
                    id: 'bank_section',
                    title: '🏦 బ్యాంక్ సెక్షన్ (Bank Section)',
                    headerClass: 'text-dark',
                    fields: [
                        'FILE NAME', 'Bank Name', 'IFSC code', 'Bank Account Number',
                        'EMAIL ID', 'BANK_SNO', 'SNO', 'BANK SENT',
                        'RD 1', 'RD 1 Closing Balance', 'BANK_REMARKS',
                        'RD ACCOUNT_2 (Govt. Contribution)', 'RD 2', 'RD2_balance'
                    ]
                },
                {
                    id: 'nominee_section',
                    title: '👨‍👩‍👧 నామినీ సెక్షన్ (Nominee Section)',
                    headerClass: 'text-info',
                    fields: [
                        'Nominee Name', 'Relation', 'Nominee Aadhar', 'Nominee DOB'
                    ]
                }
            ];

            const assignedFields = new Set();

            sections.forEach(sec => {
                const presentFields = sec.fields.filter(f => columns.includes(f));
                if (presentFields.length === 0) return;

                let secHtml = `
                    <div class="section-card" id="${sec.id}">
                        <div class="section-header ${sec.headerClass}">${sec.title}</div>
                        <div class="row">
                `;

                presentFields.forEach(col => {
                    assignedFields.add(col);
                    secHtml += createFieldHtml(col, data, aadhar, dropdowns, autoIfsc);
                });

                secHtml += `</div></div>`;
                grid.insertAdjacentHTML('beforeend', secHtml);
            });

            const extraFields = columns.filter(col => !assignedFields.has(col));
            if (extraFields.length > 0) {
                let extraHtml = `
                    <div class="section-card" id="other_section">
                        <div class="section-header text-secondary">📌 ఇతర వివరాలు (Other Details)</div>
                        <div class="row">
                `;
                extraFields.forEach(col => {
                    extraHtml += createFieldHtml(col, data, aadhar, dropdowns, autoIfsc);
                });
                extraHtml += `</div></div>`;
                grid.insertAdjacentHTML('beforeend', extraHtml);
            }

            document.getElementById('form_container').style.display = 'block';
        }

        // 8% వేతనాల ఆధారంగా MONTHLY WAGES లెక్కించడం
        function updateMonthlyWages(val) {
            const wages = Number(val);
            const monthlyWagesInput = document.getElementById('monthly_wages_input');
            if (monthlyWagesInput && !isNaN(wages)) {
                monthlyWagesInput.value = Math.round((wages * 100) / 8);
            }
        }

        // డేటా సేవ్ చేసే ఫంక్షన్
        async function saveBeneficiaryData() {
            const form = document.getElementById('dynamic_beneficiary_form');
            
            // --- మొబైల్ నంబర్ వాలిడేషన్ (JavaScript) ---
            const contactInput = form.querySelector('input[name="Contact Number"]');
            if (contactInput) {
                const contactVal = contactInput.value.trim();
                if (contactVal && (contactVal.length !== 10 || !/^\d+$/.test(contactVal))) {
                    alert('దయచేసి సరైన 10 అంకెల మొబైల్ నంబర్ ఎంటర్ చేయండి!');
                    contactInput.focus();
                    return;
                }
            }

            const formData = {};
            const inputs = form.querySelectorAll('input, select');
            
            inputs.forEach(input => {
                if (input.name && input.name !== 'action_type' && input.name !== 'row_index') {
                    formData[input.name] = input.value;
                }
            });

            // --- DD / MM / YYYY తేదీ కాలమ్స్ వాలిడేషన్ & కన్వర్షన్ ---
            const dmyGroups = form.querySelectorAll('[data-dmy-col]');
            for (const grp of dmyGroups) {
                const colName = grp.getAttribute('data-dmy-col');
                const parsed = readDmyAsIso(colName);
                if (!parsed.valid) {
                    alert(`${colName} కోసం సరైన డే / మంత్ / ఇయర్ (DD / MM / YYYY) తేదీని ఎంటర్ చేయండి!`);
                    return;
                }
                formData[colName] = parsed.isoValue;
            }

            const payload = {
                action_type: document.getElementById('action_type').value,
                row_index: document.getElementById('row_index').value,
                form_data: formData
            };

            try {
                const response = await fetch('/cf/save-beneficiary', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                alert(result.message);
                if (result.status === 'success') {
                    location.reload();
                }
            } catch (error) {
                alert('డేటా సేవ్ చేయడంలో సమస్య ఏర్పడింది.');
            }
        }

        // లాగౌట్ ఫంక్షన్
        async function cfLogout() {
            await fetch('/cf/logout', {method: 'POST'});
            window.location.href = '/cf/login';
        }
    </script>
</body>
