<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CF డాష్‌బోర్డ్ - రిపోర్ట్స్ డౌన్‌లోడ్</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Client-side OCR కోసం Tesseract.js v5 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
    <style>
        .section-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            background-color: #f8fafc;
        }
        .section-header {
            font-size: 1rem;
            font-weight: 700;
            padding-bottom: 8px;
            margin-bottom: 14px;
            border-bottom: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dmy-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dmy-input {
            text-align: center;
        }
        .dmy-day, .dmy-month {
            max-width: 68px;
        }
        .dmy-year {
            max-width: 95px;
        }
        .scan-btn {
            white-space: nowrap;
            font-weight: 600;
        }
        .candidate-chip {
            cursor: pointer;
            font-size: 1.05rem;
            padding: 10px 16px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="bg-light">
    <!-- నెవ్‌బార్ -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand fw-bold">🏛️ CF పోర్టల్ - స్వాగతం, {{ cf_name }}</span>
        <button class="btn btn-outline-light btn-sm fw-bold" onclick="cfLogout()">లాగౌట్</button>
    </nav>

    <!-- రిపోర్ట్ డౌన్‌లోడ్ సెక్షన్ -->
    <div class="container my-5" style="max-width: 600px;">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <h4 class="fw-bold text-secondary mb-4 text-center">📥 మీ నెలవారీ రిపోర్ట్‌ని డౌన్‌లోడ్ చేసుకోండి</h4>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">నెలను ఎంచుకోండి (Select Month):</label>
                    <select name="month_number" id="month_select" class="form-select form-select-lg">
                        {% for m_num, m_name in months.items() %}
                        <option value="{{ m_num }}">Month {{ m_num }} ({{ m_name }})</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="row g-2">
                    <div class="col-md-6">
                        <button type="submit" formaction="/cf/download-report" class="btn btn-primary w-100 py-3 fw-bold shadow-sm">
                            📊 ఏరియా/నేమ్ వైజ్ రిపోర్ట్
                        </button>
                    </div>
                    <div class="col-md-6">
                        <button type="submit" formaction="/cf/download-report-allotted-bank" class="btn btn-success w-100 py-3 fw-bold shadow-sm">
                            🏦 బ్యాంక్ అలొకేషన్ వైజ్ రిపోర్ట్
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- ఆధార్ సెర్చ్ & డేటా ఎంట్రీ సెక్షన్ -->
    <div class="container my-4" style="max-width: 850px;">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
            <h4 class="fw-bold text-secondary mb-3 text-center">🔍 లబ్ధిదారుల ఆధార్ సెర్చ్ & డేటా ఎంట్రీ</h4>
            
            <div class="mb-3">
                <label class="form-label fw-semibold">బ్యాంక్ ఫైల్ పేరు ఎంచుకోండి (File Name):</label>
                <select id="file_name_select" class="form-select form-select-lg mb-3" onchange="onFileNameChanged()">
                    <option value="">-- ఫైల్ పేరును ఎంచుకోండి --</option>
                </select>
            </div>

            <!-- ఆధార్ సెర్చ్ ఇన్‌పుట్ -->
            <div class="input-group mb-3">
                <input type="text" id="search_aadhar" class="form-control form-control-lg" placeholder="ఆధార్ నంబర్ ఎంటర్ చేయండి..." maxlength="12" oninput="handleSearchAadharManualInput(this)" onkeypress="if(event.key === 'Enter') searchAadhar();">
                <button class="btn btn-outline-primary px-3 fw-bold" type="button" onclick="triggerCameraScan('search_aadhar', 'Aadhar Number')">📷 ఆధార్ స్కాన్</button>
                <button class="btn btn-primary px-4 fw-bold" onclick="searchAadhar()">సెర్చ్ చేయి</button>
            </div>
        </div>

        <!-- డైనమిక్ ఫారమ్ డిస్‌ప్లే అయ్యే ఏరియా -->
        <div id="form_container" class="card border-0 shadow-sm rounded-4 p-4 bg-white" style="display: none;">
            <h5 id="form_title" class="fw-bold mb-3 text-primary"></h5>
            <form id="dynamic_beneficiary_form">
                <input type="hidden" id="action_type">
                <input type="hidden" id="row_index">
                
                <div id="form_fields_grid">
                    <!-- జావాస్క్రిప్ట్ ద్వారా 4 సెక్షన్లతో డైనమిక్ ఫీల్డ్స్ ఇక్కడ వస్తాయి -->
                </div>
                
                <div class="text-center mt-4">
                    <button type="button" class="btn btn-success px-5 py-2 fw-bold shadow-sm" onclick="saveBeneficiaryData()">సేవ్ / అప్‌డేట్ చేయి</button>
                </div>
            </form>
        </div>
    </div>

    <!-- దాచిన కెమెరా ఇన్‌పుట్ -->
    <input type="file" id="ocr_camera_input" accept="image/*" capture="environment" style="display: none;" onchange="handleCapturedImage(event)">

    <!-- స్కాన్ ఫలితాల Modal -->
    <div class="modal fade" id="ocrSelectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="ocrModalTitle">📷 స్కాన్ అవుతోంది...</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="ocrStatusBox" class="alert alert-info py-2 small mb-3 d-flex align-items-center gap-2">
                        <div class="spinner-border spinner-border-sm text-primary" id="ocrSpinner" role="status"></div>
                        <span id="ocrStatusText">ఫోటో నుండి వివరాలను వేగంగా చదువుతోంది...</span>
                    </div>

                    <div id="ocrExtractedSummary" class="bg-light border rounded-3 p-3 mb-3 small" style="display: none;"></div>

                    <div id="ocrCandidatesSection" style="display: none;" class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">గుర్తించిన నంబర్లు (ఒక్క ట్యాప్‌తో ఫీల్డ్‌లో పడుతుంది):</label>
                        <div id="ocrCandidatesList" class="d-flex flex-wrap gap-2"></div>
                    </div>

                    <div id="ocrManualNumberBox" class="mb-2">
                        <label class="form-label fw-semibold small text-secondary">నంబర్ సరిచూసుకోవడానికి / మార్చుకోవడానికి:</label>
                        <div class="input-group">
                            <input type="text" id="ocrManualPickInput" class="form-control form-control-lg fw-bold" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            <button type="button" class="btn btn-success fw-bold px-3" onclick="applyManualOcrValue()">ఫీల్డ్‌లో వేయి</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let fileIfscMap = {};
        let activeScanTarget = { element: null, fieldName: '' };
        let ocrModalInstance = null;
        let isProgrammaticValueSet = false;

        let pendingScannedAadhaarDetails = null;
        let pendingScannedNomineeDetails = null;
        let pendingScannedAddressDetails = null;

        let digitWorker = null;
        let textWorker = null;

        const SCANNABLE_FIELDS = ['Aadhar Number', 'Bank Account Number', 'Contact Number', 'Nominee Aadhar'];

        const KNOWN_DISTRICTS = [
            'RAJANNA SIRCILLA', 'HYDERABAD', 'KARIMNAGAR', 'WARANGAL', 'NIZAMABAD',
            'KHAMMAM', 'NALGONDA', 'MEDAK', 'ADILABAD', 'MAHABUBNAGAR',
            'RANGAREDDY', 'SANGAREDDY', 'SIDDIPET', 'JAGTIAL', 'PEDDAPALLI', 'KAMARREDDY'
        ];

        const KNOWN_MANDALS = [
            'SIRCILLA', 'YELLAREDDIPET', 'MUSTABAD', 'GAMBHIRAOPET', 'VEERANAPET',
            'ELLANTHAKUNTA', 'BOINPALLE', 'THANGALLAPALLY', 'CHANDURTHY', 'RUDRANGI', 'MEERPET'
        ];

        const STATE_AND_JUNK_WORDS = [
            'TELANGANA', 'ANDHRA PRADESH', 'INDIA', 'ADDRESS', 'TO', 'C/O', 'S/O', 'D/O', 'W/O',
            'PRINT DATE', 'UIDAI', 'AADHAAR', 'AADHAR', 'PIN', 'PINCODE'
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            const modalEl = document.getElementById('ocrSelectModal');
            if (modalEl && window.bootstrap) {
                ocrModalInstance = new bootstrap.Modal(modalEl);
            }

            try {
                const res = await fetch('/cf/get-bank-files');
                const data = await res.json();
                if (data.status === 'success') {
                    fileIfscMap = data.file_ifsc_map || {};
                    const select = document.getElementById('file_name_select');
                    data.file_names.forEach(name => {
                        let opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        select.appendChild(opt);
                    });
                }
            } catch (e) {
                console.error("Error loading bank files", e);
            }
        });

        function handleSearchAadharManualInput(inputEl) {
            inputEl.value = inputEl.value.replace(/[^0-9]/g, '');
            if (!isProgrammaticValueSet) {
                pendingScannedAadhaarDetails = null;
                pendingScannedAddressDetails = null;
            }
        }

        function triggerCameraScan(targetOrId, fieldName) {
            const el = typeof targetOrId === 'string' ? document.getElementById(targetOrId) : targetOrId;
            if (!el) {
                alert('టార్గెట్ ఫీల్డ్ కనుగొనబడలేదు.');
                return;
            }
            activeScanTarget = { element: el, fieldName: fieldName };
            const fileInput = document.getElementById('ocr_camera_input');
            fileInput.value = '';
            fileInput.click();
        }

        function buildProcessedCanvas(img, angleDeg, mode = 'text') {
            const maxDim = (mode === 'digits') ? 1050 : 1150;
            const origW = img.naturalWidth || img.width;
            const origH = img.naturalHeight || img.height;
            const scale = Math.max(origW, origH) > maxDim ? (maxDim / Math.max(origW, origH)) : 1;
            const w = Math.max(1, Math.round(origW * scale));
            const h = Math.max(1, Math.round(origH * scale));

            const canvas = document.createElement('canvas');
            if (angleDeg === 90 || angleDeg === 270) {
                canvas.width = h;
                canvas.height = w;
            } else {
                canvas.width = w;
                canvas.height = h;
            }

            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            if (angleDeg === 90) {
                ctx.translate(canvas.width, 0);
                ctx.rotate(Math.PI / 2);
            } else if (angleDeg === 270) {
                ctx.translate(0, canvas.height);
                ctx.rotate(-Math.PI / 2);
            }
            ctx.drawImage(img, 0, 0, w, h);
            ctx.restore();

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;
            let minVal = 255;
            let maxVal = 0;

            for (let i = 0; i < d.length; i += 4) {
                const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                if (gray < minVal) minVal = gray;
                if (gray > maxVal) maxVal = gray;
            }

            const range = Math.max(30, maxVal - minVal);
            const contrast = (mode === 'digits') ? 1.45 : 1.3;
            const intercept = 128 * (1 - contrast);

            for (let i = 0; i < d.length; i += 4) {
                const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                const norm = ((gray - minVal) / range) * 255;
                let adj = Math.min(255, Math.max(0, norm * contrast + intercept));

                if (mode === 'digits') {
                    adj = adj < 145 ? Math.max(0, adj * 0.65) : Math.min(255, 180 + (adj - 145) * 0.65);
                }

                d[i] = d[i + 1] = d[i + 2] = adj;
            }
            ctx.putImageData(imgData, 0, 0);

            return canvas;
        }

        async function getDigitWorker() {
            if (digitWorker) return digitWorker;
            digitWorker = await Tesseract.createWorker('eng', 1, {
                workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
                corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core.wasm.js',
                langPath: 'https://tessdata.projectnaptha.com/4.0.0'
            });
            await digitWorker.setParameters({
                tessedit_char_whitelist: '0123456789+- '
            });
            return digitWorker;
        }

        async function getTextWorker() {
            if (textWorker) return textWorker;
            textWorker = await Tesseract.createWorker('eng', 1, {
                workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
                corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core.wasm.js',
                langPath: 'https://tessdata.projectnaptha.com/4.0.0'
            });
            return textWorker;
        }

        function extractNameAboveDob(lines) {
            const nonNameKeywords = /(government|india|unique|identification|authority|aadhaar|aadhar|year|birth|yob|dob|date|issue|download|male|female|transgender|camscanner|generated|address|village|mandal|district|state|pin|mobile|phone|vid|enrolment|enrollment|care\s+of|son\s+of|daughter\s+of|wife\s+of)/i;
            const relationPrefixRegex = /\b(s\s*\/\s*o|d\s*\/\s*o|w\s*\/\s*o|c\s*\/\s*o|so|do|wo|co)\b/i;

            function isValidPersonName(rawLine) {
                if (!rawLine) return '';
                if (nonNameKeywords.test(rawLine)) return '';
                if (relationPrefixRegex.test(rawLine)) return '';
                if (/\d/.test(rawLine)) return '';

                const cleaned = rawLine.replace(/[^A-Za-z\s\.]/g, ' ')
                                       .replace(/\./g, ' ')
                                       .replace(/\s+/g, ' ')
                                       .trim();

                if (cleaned.length < 3 || cleaned.length > 50) return '';
                if (!/^[A-Za-z\s]+$/.test(cleaned)) return '';

                const words = cleaned.split(' ').filter(Boolean);
                if (words.length < 1 || words.length > 6) return '';
                if (!words.some(w => w.length >= 3)) return '';

                return cleaned.toUpperCase();
            }

            let dobIdx = -1;
            for (let i = 0; i < lines.length; i++) {
                if (/issue\s*date/i.test(lines[i])) continue;
                if (/(year\s*of\s*birth|yob|dob|date\s*of\s*birth|birth)/i.test(lines[i]) ||
                    /\b\d{1,2}[\/\-]\d{1,2}[\/\-](19\d{2}|20\d{2})\b/.test(lines[i])) {
                    dobIdx = i;
                    break;
                }
            }

            if (dobIdx > 0) {
                const start = Math.max(0, dobIdx - 4);
                for (let i = dobIdx - 1; i >= start; i--) {
                    const candidate = isValidPersonName(lines[i]);
                    if (candidate) return candidate;
                }
            }

            for (let i = 0; i < lines.length; i++) {
                if (/government\s*of\s*india|of\s*india/i.test(lines[i])) {
                    for (let j = i + 1; j < Math.min(lines.length, i + 6); j++) {
                        const candidate = isValidPersonName(lines[j]);
                        if (candidate) return candidate;
                    }
                }
            }

            return '';
        }

        function parseAddressDetailsFromText(rawText) {
            const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const joinedUpper = rawText.toUpperCase();

            let houseNo = '';
            let fatherName = '';
            let areaName = '';
            let village = '';
            let mandal = '';
            let district = '';

            let addrStartIdx = -1;
            for (let i = 0; i < lines.length; i++) {
                if (/^\s*(to|address|చిరునామా)\b/i.test(lines[i]) || /\baddress\b\s*[:\-]/i.test(lines[i]) || /\bc\s*\/\s*o\b/i.test(lines[i])) {
                    addrStartIdx = i;
                    break;
                }
            }

            const addrLines = addrStartIdx >= 0
                ? lines.slice(addrStartIdx, Math.min(lines.length, addrStartIdx + 7))
                : lines;

            const addrBlockText = addrLines.join(', ');

            const coMatch = addrBlockText.match(/\b(?:c\s*\/\s*o|s\s*\/\s*o|d\s*\/\s*o|w\s*\/\s*o|care\s+of|son\s+of|daughter\s+of|wife\s+of)\s*[:\-]?\s*([A-Za-z\s\.]{3,40})/i);
            if (coMatch && coMatch[1]) {
                const rawFather = coMatch[1].split(',')[0].replace(/[^A-Za-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
                if (rawFather.length >= 3 && !/^(ADDRESS|TO|HOUSE|NO|VILLAGE|MANDAL|DISTRICT|TELANGANA|INDIA)$/i.test(rawFather)) {
                    fatherName = rawFather.toUpperCase();
                }
            }

            const hnoMatch = addrBlockText.match(/\b(\d{1,4}\s*[\-\/]\s*\d{1,4}[A-Za-z0-9\/\-]*)\b/);
            if (hnoMatch && hnoMatch[1]) {
                const cand = hnoMatch[1].replace(/\s+/g, '').toUpperCase();
                if (!/^\d{6}$/.test(cand) && !/^(19\d{2}|20\d{2})$/.test(cand)) {
                    houseNo = cand;
                }
            }

            for (const dist of KNOWN_DISTRICTS) {
                const dRegex = new RegExp(`\\b${dist}\\b`, 'i');
                if (dRegex.test(addrBlockText) || dRegex.test(joinedUpper)) {
                    district = dist;
                    break;
                }
            }

            if (!district) {
                const stateBeforeMatch = addrBlockText.match(/([A-Za-z\s]{3,25})\s*,?\s*\b(?:TELANGANA|ANDHRA\s*PRADESH)\b/i);
                if (stateBeforeMatch && stateBeforeMatch[1]) {
                    const parts = stateBeforeMatch[1].split(',').map(p => p.trim()).filter(Boolean);
                    const lastPart = (parts[parts.length - 1] || '').replace(/[^A-Za-z\s]/g, '').trim().toUpperCase();
                    if (lastPart.length >= 3) {
                        district = lastPart;
                    }
                }
            }

            let cleanedAddressForSplit = addrBlockText
                .replace(/^\s*(?:to|address|చిరునామా)\s*[:\-]?\s*/i, '')
                .replace(/\b(?:c\s*\/\s*o|s\s*\/\s*o|d\s*\/\s*o|w\s*\/\s*o)\s*[:\-]?\s*[A-Za-z\s\.]+/i, '')
                .replace(/\b\d{6}\b/g, '')
                .replace(/\b(?:TELANGANA|ANDHRA\s*PRADESH|INDIA)\b/gi, '')
                .replace(/\b\d{2}[\/\-]\d{2}[\/\-]\d{4}\b/g, '');

            if (houseNo) {
                cleanedAddressForSplit = cleanedAddressForSplit.replace(new RegExp(houseNo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '');
            }
            if (district) {
                cleanedAddressForSplit = cleanedAddressForSplit.replace(new RegExp(`\\b${district}\\b`, 'gi'), '');
            }

            const rawSegments = cleanedAddressForSplit
                .split(/[,\n]+/)
                .map(seg => seg.replace(/[^A-Za-z0-9\s\-\/]/g, ' ').replace(/\s+/g, ' ').trim())
                .filter(seg => {
                    if (!seg || seg.length < 2) return false;
                    if (/^\d+$/.test(seg)) return false;
                    if (STATE_AND_JUNK_WORDS.includes(seg.toUpperCase())) return false;
                    return true;
                });

            if (rawSegments.length >= 2) {
                areaName = rawSegments[rawSegments.length - 2].toUpperCase();
                village = rawSegments[rawSegments.length - 1].toUpperCase();
            } else if (rawSegments.length === 1) {
                village = rawSegments[0].toUpperCase();
            }

            for (const mnd of KNOWN_MANDALS) {
                const mRegex = new RegExp(`\\b${mnd}\\b`, 'i');
                if (mRegex.test(addrBlockText)) {
                    mandal = mnd;
                    break;
                }
            }

            const hasAnyAddress = Boolean(houseNo || village || mandal || district || fatherName || areaName);

            return {
                hasAnyAddress,
                houseNo,
                areaName,
                village,
                mandal,
                district,
                fatherName
            };
        }

        // 10 డిజిట్స్ కాంటాక్ట్ నంబర్ (6/7/8/9 తో మొదలయ్యేది) & ఇతర నంబర్లను కచ్చితంగా వేరు చేసే ఫంక్షన్
        function extractNumbersFromText(rawText, fieldName) {
            const spacedAadhaar = [];
            const validIndianMobiles = [];
            const allDigitSequences = new Set();

            // 1. 10-డిజిట్ ఇండియన్ మొబైల్ నంబర్ల కోసం ప్రత్యేక సెర్చ్ (+91, 0, స్పేస్, హైఫన్ ఉన్నా సరే)
            // ఉదా: 9848012345, 98480 12345, +91 98480-12345, 09848012345
            const mobileRegex = /(?:^|[^0-9])(?:\+?91[\s\-]?|0)?([6-9]\d{4}[\s\-]?\d{5})(?!\d)/g;
            let mMatch;
            while ((mMatch = mobileRegex.exec(rawText)) !== null) {
                const clean10 = mMatch[1].replace(/\D/g, '');
                if (clean10.length === 10 && /^[6-9]\d{9}$/.test(clean10)) {
                    if (!validIndianMobiles.includes(clean10)) {
                        validIndianMobiles.push(clean10);
                    }
                    allDigitSequences.add(clean10);
                }
            }

            // 2. 4-4-4 ఆధార్ నంబర్లు
            const aadhaarPattern = /(?:^|[^0-9])(\d{4})[\s\-]+(\d{4})[\s\-]+(\d{4})(?!\d)/g;
            let match;
            while ((match = aadhaarPattern.exec(rawText)) !== null) {
                const clean12 = `${match[1]}${match[2]}${match[3]}`;
                if (!spacedAadhaar.includes(clean12)) {
                    spacedAadhaar.push(clean12);
                }
                allDigitSequences.add(clean12);
            }

            // 3. ఇతర విడి అంకెల సమూహాలు (లైన్ మొత్తాన్ని అతికించకుండా, విడి గ్రూపులను మాత్రమే తీసుకోవడం)
            const lines = rawText.split(/\r?\n/);
            for (const line of lines) {
                const chunks = line.match(/\d[\d\s\-]{7,20}\d/g) || [];
                for (const rawChunk of chunks) {
                    const digitsOnly = rawChunk.replace(/\D/g, '');
                    if (digitsOnly.length >= 9 && digitsOnly.length <= 18) {
                        allDigitSequences.add(digitsOnly);
                    }
                }
            }

            let numbers = Array.from(allDigitSequences);
            let exact = false;

            if (fieldName === 'Contact Number') {
                if (validIndianMobiles.length > 0) {
                    numbers = validIndianMobiles;
                    exact = true;
                } else {
                    // Fallback: 6-9 తో మొదలయ్యే 10 అంకెల నంబర్లు
                    const fallback10 = numbers.filter(n => n.length === 10 && /^[6-9]/.test(n));
                    if (fallback10.length > 0) {
                        numbers = fallback10;
                        exact = true;
                    } else {
                        numbers = numbers.filter(n => n.length === 10);
                    }
                }
            } else if (fieldName === 'Aadhar Number' || fieldName === 'Nominee Aadhar') {
                if (spacedAadhaar.length > 0) {
                    numbers = spacedAadhaar;
                    exact = true;
                } else {
                    const exact12 = numbers.filter(n => n.length === 12);
                    if (exact12.length > 0) {
                        numbers = exact12;
                        exact = true;
                    }
                }
            } else if (fieldName === 'Bank Account Number') {
                const accounts = numbers.filter(n => n.length >= 9 && n.length <= 18);
                if (accounts.length > 0) {
                    numbers = accounts;
                    exact = true;
                }
            }

            return { exact, numbers };
        }

        function extractDobFromLines(lines) {
            for (const line of lines) {
                if (/issue\s*date/i.test(line)) continue;
                const dMatch = line.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})\b/);
                if (dMatch) {
                    const dNum = parseInt(dMatch[1], 10);
                    const mNum = parseInt(dMatch[2], 10);
                    const yNum = parseInt(dMatch[3], 10);
                    if (dNum >= 1 && dNum <= 31 && mNum >= 1 && mNum <= 12 && yNum >= 1915 && yNum <= 2025) {
                        return {
                            yob: String(yNum),
                            dobFull: {
                                dd: String(dNum).padStart(2, '0'),
                                mm: String(mNum).padStart(2, '0'),
                                yyyy: String(yNum)
                            }
                        };
                    }
                }
            }

            for (const line of lines) {
                if (/issue\s*date/i.test(line)) continue;
                if (/year\s*of\s*birth|yob|birth|dob/i.test(line)) {
                    const yrMatch = line.match(/\b(19\d{2}|20\d{2})\b/);
                    if (yrMatch) {
                        const yCandidate = parseInt(yrMatch[1], 10);
                        if (yCandidate >= 1915 && yCandidate <= 2025) {
                            return { yob: String(yCandidate), dobFull: null };
                        }
                    }
                }
            }

            return { yob: '', dobFull: null };
        }

        async function handleCapturedImage(event) {
            const file = event.target.files && event.target.files[0];
            if (!file || !activeScanTarget.element) return;

            const fieldName = activeScanTarget.fieldName;
            const isNomineeScan = (fieldName === 'Nominee Aadhar');
            const isBeneficiaryAadhaarScan = (fieldName === 'Aadhar Number');
            const isAddressScan = (fieldName === 'Residential Address');
            const isDigitOnlyField = (fieldName === 'Contact Number' || fieldName === 'Bank Account Number');

            if (isNomineeScan) {
                pendingScannedNomineeDetails = null;
            } else if (isBeneficiaryAadhaarScan) {
                pendingScannedAadhaarDetails = null;
                pendingScannedAddressDetails = null;
            } else if (isAddressScan) {
                pendingScannedAddressDetails = null;
            }

            document.getElementById('ocrModalTitle').textContent = `📷 ${fieldName} స్కాన్`;
            document.getElementById('ocrStatusBox').className = 'alert alert-info py-2 small mb-3 d-flex align-items-center gap-2';
            document.getElementById('ocrSpinner').style.display = 'inline-block';
            document.getElementById('ocrStatusText').textContent = 'ఫోటోను వేగంగా ప్రాసెస్ చేస్తోంది...';
            document.getElementById('ocrExtractedSummary').style.display = 'none';
            document.getElementById('ocrCandidatesSection').style.display = 'none';
            document.getElementById('ocrCandidatesList').innerHTML = '';
            document.getElementById('ocrManualPickInput').value = '';
            document.getElementById('ocrManualNumberBox').style.display = isAddressScan ? 'none' : 'block';

            if (ocrModalInstance) {
                ocrModalInstance.show();
            }

            const objectUrl = URL.createObjectURL(file);
            const img = await new Promise((resolve) => {
                const imageObj = new Image();
                imageObj.onload = () => resolve(imageObj);
                imageObj.onerror = () => resolve(null);
                imageObj.src = objectUrl;
            });

            if (!img) {
                URL.revokeObjectURL(objectUrl);
                document.getElementById('ocrSpinner').style.display = 'none';
                document.getElementById('ocrStatusBox').className = 'alert alert-danger py-2 small mb-3';
                document.getElementById('ocrStatusText').textContent = 'ఫోటో చదవలేకపోయాము. మళ్లీ ఫోటో తీయండి.';
                return;
            }

            if (typeof Tesseract === 'undefined') {
                URL.revokeObjectURL(objectUrl);
                document.getElementById('ocrSpinner').style.display = 'none';
                document.getElementById('ocrStatusBox').className = 'alert alert-danger py-2 small mb-3';
                document.getElementById('ocrStatusText').textContent = 'OCR ఇంజిన్ లోడ్ కాలేదు. ఇంటర్నెట్ చెక్ చేసి పేజీని రీలోడ్ చేయండి.';
                return;
            }

            try {
                const anglesToTry = [0, 90, 270];
                let finalNumbers = [];
                let exactFound = false;
                let extractedName = '';
                let extractedDob = { yob: '', dobFull: null };
                let extractedAddress = { hasAnyAddress: false, houseNo: '', areaName: '', village: '', mandal: '', district: '', fatherName: '' };

                const worker = isDigitOnlyField ? await getDigitWorker() : await getTextWorker();

                for (let idx = 0; idx < anglesToTry.length; idx++) {
                    const angle = anglesToTry[idx];
                    document.getElementById('ocrStatusText').textContent = `స్కాన్ చేస్తోంది (${idx + 1}/${anglesToTry.length})...`;

                    const mode = isDigitOnlyField ? 'digits' : 'text';
                    const canvas = buildProcessedCanvas(img, angle, mode);
                    const ret = await worker.recognize(canvas);
                    canvas.width = 0;
                    canvas.height = 0;

                    const rawText = (ret && ret.data && ret.data.text) ? ret.data.text : '';
                    const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

                    if (isAddressScan) {
                        const addr = parseAddressDetailsFromText(rawText);
                        extractedAddress = {
                            hasAnyAddress: extractedAddress.hasAnyAddress || addr.hasAnyAddress,
                            houseNo: extractedAddress.houseNo || addr.houseNo,
                            areaName: extractedAddress.areaName || addr.areaName,
                            village: extractedAddress.village || addr.village,
                            mandal: extractedAddress.mandal || addr.mandal,
                            district: extractedAddress.district || addr.district,
                            fatherName: extractedAddress.fatherName || addr.fatherName
                        };
                        if (extractedAddress.houseNo && extractedAddress.village && extractedAddress.district) {
                            break;
                        }
                        continue;
                    }

                    const numRes = extractNumbersFromText(rawText, fieldName);
                    if (numRes.numbers.length > 0) {
                        finalNumbers = numRes.numbers;
                        exactFound = numRes.exact;
                    }

                    if (isBeneficiaryAadhaarScan || isNomineeScan) {
                        if (!extractedName) {
                            extractedName = extractNameAboveDob(lines);
                        }
                        if (!extractedDob.yob && !extractedDob.dobFull) {
                            extractedDob = extractDobFromLines(lines);
                        }
                    }

                    // 10 డిజిట్స్ కాంటాక్ట్ నంబర్ లేదా అకౌంట్/ఆధార్ కచ్చితంగా దొరికితే వెంటనే లూప్ ఆపుతుంది
                    if (exactFound && finalNumbers.length > 0) {
                        if (!(isBeneficiaryAadhaarScan || isNomineeScan) || extractedName) {
                            break;
                        }
                    }
                }

                URL.revokeObjectURL(objectUrl);
                document.getElementById('ocrSpinner').style.display = 'none';

                if (isAddressScan) {
                    const summaryBox = document.getElementById('ocrExtractedSummary');
                    summaryBox.style.display = 'block';
                    if (extractedAddress.hasAnyAddress) {
                        pendingScannedAddressDetails = extractedAddress;
                        applyAddressDetailsToForm(extractedAddress, false);
                        document.getElementById('ocrStatusBox').className = 'alert alert-success py-2 small mb-3';
                        document.getElementById('ocrStatusText').textContent = 'అడ్రస్ వివరాలు ఫారమ్‌లో నింపబడ్డాయి:';
                        summaryBox.innerHTML = `
                            <div class="fw-bold text-success mb-2">✅ గుర్తించిన అడ్రస్ వివరాలు:</div>
                            ${extractedAddress.houseNo ? `<div><strong>ఇంటి నంబర్ (H.No):</strong> ${extractedAddress.houseNo}</div>` : ''}
                            ${extractedAddress.fatherName ? `<div><strong>తండ్రి/భర్త పేరు (C/O):</strong> ${extractedAddress.fatherName}</div>` : ''}
                            ${extractedAddress.areaName ? `<div><strong>ఏరియా:</strong> ${extractedAddress.areaName}</div>` : ''}
                            ${extractedAddress.village ? `<div><strong>గ్రామం / ఊరు (Village):</strong> ${extractedAddress.village}</div>` : ''}
                            ${extractedAddress.mandal ? `<div><strong>మండలం (Mandal):</strong> ${extractedAddress.mandal}</div>` : ''}
                            ${extractedAddress.district ? `<div><strong>జిల్లా (District):</strong> ${extractedAddress.district}</div>` : ''}
                        `;
                    } else {
                        document.getElementById('ocrStatusBox').className = 'alert alert-warning py-2 small mb-3';
                        document.getElementById('ocrStatusText').textContent = 'TO / Address లైన్ స్పష్టంగా కనబడలేదు. అడ్రస్ భాగాన్ని దగ్గరగా ఫోటో తీసి మళ్లీ ప్రయత్నించండి.';
                    }
                    return;
                }

                if (isBeneficiaryAadhaarScan || isNomineeScan) {
                    const detailsObj = {
                        name: extractedName || '',
                        yob: extractedDob.yob || '',
                        dobFull: extractedDob.dobFull || null
                    };

                    if (isNomineeScan) {
                        pendingScannedNomineeDetails = detailsObj;
                        applyNomineeDetailsToForm(pendingScannedNomineeDetails);
                    } else {
                        pendingScannedAadhaarDetails = detailsObj;
                        applyAadhaarDetailsToForm(pendingScannedAadhaarDetails, false);
                    }

                    const roleLabel = isNomineeScan ? 'నామినీ' : 'లబ్ధిదారుని';
                    const summaryBox = document.getElementById('ocrExtractedSummary');
                    summaryBox.style.display = 'block';
                    summaryBox.innerHTML = `
                        <div class="fw-bold text-success mb-1">✅ గుర్తించిన ${roleLabel} వివరాలు:</div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold mb-1">పేరు (DOB పైన ఉన్నది / సరిచేసుకోవడానికి):</label>
                            <input type="text" class="form-control form-control-sm fw-bold text-uppercase" 
                                   value="${extractedName || ''}" 
                                   placeholder="పేరు ఇక్కడ టైప్ చేయవచ్చు"
                                   oninput="updateEditedOcrName(this.value, ${isNomineeScan})">
                        </div>
                        ${extractedDob.yob ? `<div><strong>DOB / పుట్టిన సంవత్సరం:</strong> ${extractedDob.dobFull ? `${extractedDob.dobFull.dd}/${extractedDob.dobFull.mm}/${extractedDob.dobFull.yyyy}` : extractedDob.yob}</div>` : ''}
                    `;
                }

                if (exactFound && finalNumbers.length === 1) {
                    if ((isBeneficiaryAadhaarScan || isNomineeScan) && !extractedName) {
                        document.getElementById('ocrStatusBox').className = 'alert alert-success py-2 small mb-3';
                        document.getElementById('ocrStatusText').textContent = 'ఆధార్ నంబర్ గుర్తించబడింది! పేరు సరిచూసి కింది బటన్ నొక్కండి:';
                        document.getElementById('ocrManualPickInput').value = finalNumbers[0];
                        return;
                    }
                    selectScannedNumber(finalNumbers[0]);
                    return;
                }

                if (finalNumbers.length > 0) {
                    document.getElementById('ocrStatusBox').className = 'alert alert-success py-2 small mb-3';
                    document.getElementById('ocrStatusText').textContent = 'గుర్తించిన నంబర్లలో సరైన దానిపై ట్యాప్ చేయండి:';
                    document.getElementById('ocrCandidatesSection').style.display = 'block';
                    document.getElementById('ocrManualPickInput').value = finalNumbers[0];

                    const listContainer = document.getElementById('ocrCandidatesList');
                    finalNumbers.forEach(num => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'btn btn-outline-primary candidate-chip fw-bold';
                        btn.textContent = num.length === 12 ? `${num.slice(0,4)} ${num.slice(4,8)} ${num.slice(8,12)}` : num;
                        btn.onclick = () => selectScannedNumber(num);
                        listContainer.appendChild(btn);
                    });
                } else {
                    document.getElementById('ocrStatusBox').className = 'alert alert-warning py-2 small mb-3';
                    document.getElementById('ocrStatusText').textContent = fieldName === 'Contact Number'
                        ? '10 అంకెల మొబైల్ నంబర్ స్పష్టంగా కనబడలేదు. నంబర్‌ను దగ్గరగా ఫోటో తీయండి లేదా కింద టైప్ చేయండి.'
                        : 'నంబర్ స్పష్టంగా కనబడలేదు. కొంచెం దగ్గరగా ఫోటో తీయండి లేదా కింద టైప్ చేయండి.';
                }
            } catch (err) {
                console.error('OCR Error:', err);
                URL.revokeObjectURL(objectUrl);
                document.getElementById('ocrSpinner').style.display = 'none';
                document.getElementById('ocrStatusBox').className = 'alert alert-danger py-2 small mb-3';
                document.getElementById('ocrStatusText').textContent = 'స్కాన్ చేయడంలో సమస్య వచ్చింది. మళ్లీ ప్రయత్నించండి లేదా కింద నంబర్ టైప్ చేయండి.';
            }
        }

        function applyAddressDetailsToForm(addr, onlyIfEmpty = true) {
            if (!addr) return;
            const form = document.getElementById('dynamic_beneficiary_form');
            const formContainer = document.getElementById('form_container');
            if (!form || !formContainer || formContainer.style.display === 'none') return;

            if (addr.houseNo) {
                const hnoInput = findFormInputByKeywords(
                    form,
                    ['H.NO. Residentional H.No', 'H.NO. Residential H.No', 'H.No'],
                    /residentional.*h\.?no|residential.*h\.?no/i
                );
                if (hnoInput && (!onlyIfEmpty || !hnoInput.value.trim())) {
                    hnoInput.value = addr.houseNo;
                    hnoInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }

            if (addr.fatherName) {
                const fatherInput = findFormInputByKeywords(
                    form,
                    ['Father Name', 'Father / Husband Name'],
                    /father.*name/i
                );
                if (fatherInput && (!onlyIfEmpty || !fatherInput.value.trim())) {
                    fatherInput.value = addr.fatherName;
                    fatherInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }

            if (addr.village) {
                const villInput = findFormInputByKeywords(
                    form,
                    ['VILLAGE NAME', 'Village Name'],
                    /village.*name/i
                );
                if (villInput && (!onlyIfEmpty || !villInput.value.trim())) {
                    villInput.value = addr.village;
                    villInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }

            if (addr.mandal) {
                const mandalSelect = form.querySelector('select[name="MANDAL NAME"]');
                if (mandalSelect) {
                    const opt = Array.from(mandalSelect.options).find(o => o.value.toUpperCase() === addr.mandal.toUpperCase());
                    if (opt) {
                        mandalSelect.value = opt.value;
                        mandalSelect.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                }
            }

            if (addr.district) {
                const distSelect = form.querySelector('select[name="DISTRICT NAME"]');
                if (distSelect) {
                    const opt = Array.from(distSelect.options).find(o => o.value.toUpperCase() === addr.district.toUpperCase());
                    if (opt) {
                        distSelect.value = opt.value;
                        distSelect.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                }
            }
        }

        function updateEditedOcrName(newName, isNominee) {
            const cleaned = newName.toUpperCase();
            if (isNominee) {
                if (!pendingScannedNomineeDetails) pendingScannedNomineeDetails = {};
                pendingScannedNomineeDetails.name = cleaned;
                applyNomineeDetailsToForm(pendingScannedNomineeDetails);
            } else {
                if (!pendingScannedAadhaarDetails) pendingScannedAadhaarDetails = {};
                pendingScannedAadhaarDetails.name = cleaned;
                applyAadhaarDetailsToForm(pendingScannedAadhaarDetails, false);
            }
        }

        function findFormInputByKeywords(form, exactNames, keywordRegex) {
            for (const name of exactNames) {
                const exactEl = form.querySelector(`input[name="${name}"]`);
                if (exactEl) return exactEl;
            }
            const allInputs = form.querySelectorAll('input[name]');
            for (const inp of allInputs) {
                if (keywordRegex.test(inp.name)) return inp;
            }
            return null;
        }

        function applyAadhaarDetailsToForm(details, onlyIfEmpty = false) {
            if (!details) return;
            const form = document.getElementById('dynamic_beneficiary_form');
            const formContainer = document.getElementById('form_container');
            if (!form || !formContainer || formContainer.style.display === 'none') return;

            if (details.name) {
                const nameInput = findFormInputByKeywords(
                    form,
                    ['Name Of Benificiary', 'Name Of Beneficiary', 'Beneficiary Name', 'Benificiary Name'],
                    /(benificiary|beneficiary).*name|name.*(benificiary|beneficiary)/i
                );
                if (nameInput && (!onlyIfEmpty || !nameInput.value.trim())) {
                    nameInput.value = details.name;
                    nameInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }

            if (details.dobFull || details.yob) {
                let dmyGroup = form.querySelector('[data-dmy-col="Date OF Birth"]') ||
                               form.querySelector('[data-dmy-col="Date of Birth"]') ||
                               form.querySelector('[data-dmy-col="DOB"]');

                if (!dmyGroup) {
                    const allGroups = form.querySelectorAll('[data-dmy-col]');
                    for (const grp of allGroups) {
                        const col = grp.getAttribute('data-dmy-col') || '';
                        if (!/nominee/i.test(col) && /(birth|dob)/i.test(col)) {
                            dmyGroup = grp;
                            break;
                        }
                    }
                }

                if (dmyGroup) {
                    const colName = dmyGroup.getAttribute('data-dmy-col');
                    const safeKey = colName.replace(/[^a-zA-Z0-9]/g, '_');
                    const ddEl = document.getElementById(`dmy_dd_${safeKey}`);
                    const mmEl = document.getElementById(`dmy_mm_${safeKey}`);
                    const yyyyEl = document.getElementById(`dmy_yyyy_${safeKey}`);

                    const hasExistingDob = (ddEl && ddEl.value.trim()) || (mmEl && mmEl.value.trim()) || (yyyyEl && yyyyEl.value.trim());

                    if (!onlyIfEmpty || !hasExistingDob) {
                        if (details.dobFull) {
                            if (ddEl) ddEl.value = details.dobFull.dd;
                            if (mmEl) mmEl.value = details.dobFull.mm;
                            if (yyyyEl) yyyyEl.value = details.dobFull.yyyy;
                        } else if (details.yob && yyyyEl) {
                            yyyyEl.value = details.yob;
                        }
                        handleDmyInput(safeKey, true);
                    }
                }
            }
        }

        function applyNomineeDetailsToForm(details) {
            if (!details) return;
            const form = document.getElementById('dynamic_beneficiary_form');
            if (!form) return;

            if (details.name) {
                const nomineeNameInput = findFormInputByKeywords(
                    form,
                    ['Nominee Name'],
                    /nominee.*name/i
                );
                if (nomineeNameInput) {
                    nomineeNameInput.value = details.name;
                    nomineeNameInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
            }

            if (details.dobFull || details.yob) {
                const dmyGroup = form.querySelector('[data-dmy-col="Nominee DOB"]') ||
                                 form.querySelector('[data-dmy-col*="Nominee"]');
                if (dmyGroup) {
                    const colName = dmyGroup.getAttribute('data-dmy-col');
                    const safeKey = colName.replace(/[^a-zA-Z0-9]/g, '_');
                    const ddEl = document.getElementById(`dmy_dd_${safeKey}`);
                    const mmEl = document.getElementById(`dmy_mm_${safeKey}`);
                    const yyyyEl = document.getElementById(`dmy_yyyy_${safeKey}`);

                    if (details.dobFull) {
                        if (ddEl) ddEl.value = details.dobFull.dd;
                        if (mmEl) mmEl.value = details.dobFull.mm;
                        if (yyyyEl) yyyyEl.value = details.dobFull.yyyy;
                    } else if (details.yob && yyyyEl) {
                        yyyyEl.value = details.yob;
                    }

                    handleDmyInput(safeKey, false);
                }
            }
        }

        function selectScannedNumber(numStr) {
            const cleanNum = String(numStr || '').replace(/[^0-9]/g, '');
            if (!activeScanTarget.element || !cleanNum) return;

            isProgrammaticValueSet = true;
            activeScanTarget.element.value = cleanNum;
            activeScanTarget.element.dispatchEvent(new Event('input', { bubbles: true }));
            activeScanTarget.element.dispatchEvent(new Event('change', { bubbles: true }));
            isProgrammaticValueSet = false;

            if (ocrModalInstance) {
                ocrModalInstance.hide();
            }
        }

        function applyManualOcrValue() {
            const val = document.getElementById('ocrManualPickInput').value;
            selectScannedNumber(val);
        }

        function onFileNameChanged() {
            const selectedFile = document.getElementById('file_name_select').value;
            const autoIfsc = (selectedFile && fileIfscMap[selectedFile]) ? fileIfscMap[selectedFile] : '';

            const ifscInput = document.querySelector('#dynamic_beneficiary_form input[name="IFSC code"]');
            if (ifscInput && autoIfsc) {
                ifscInput.value = autoIfsc;
            }

            const fileInput = document.querySelector('#dynamic_beneficiary_form input[name="FILE NAME"]');
            if (fileInput && selectedFile) {
                fileInput.value = selectedFile;
            }
        }

        async function searchAadhar() {
            const fileName = document.getElementById('file_name_select').value;
            if (!fileName) {
                alert('దయచేసి ముందుగా బ్యాంక్ ఫైల్ పేరు (File Name) ఎంచుకోండి!');
                return;
            }

            const aadhar = document.getElementById('search_aadhar').value.trim();
            if (!aadhar || aadhar.length !== 12) {
                alert('దయచేసి సరైన 12 అంకెల ఆధార్ నంబర్ ఎంటర్ చేయండి!');
                return;
            }

            pendingScannedNomineeDetails = null;

            try {
                const response = await fetch('/cf/search-beneficiary', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({aadhar_number: aadhar, file_name: fileName})
                });
                const result = await response.json();

                if (result.status === 'existing') {
                    document.getElementById('form_title').innerHTML = `<span class="text-success">📋 రికార్డు కనుగొనబడింది - ఇది అప్‌డేట్ (Update) అవుతుంది</span>`;
                    document.getElementById('action_type').value = 'update';
                    document.getElementById('row_index').value = result.row_index || '';
                    buildFormFields(result.columns, result.data, aadhar, result.dropdown_data, result.auto_ifsc);
                    
                    if (pendingScannedAadhaarDetails) {
                        applyAadhaarDetailsToForm(pendingScannedAadhaarDetails, true);
                        pendingScannedAadhaarDetails = null;
                    }
                    if (pendingScannedAddressDetails) {
                        applyAddressDetailsToForm(pendingScannedAddressDetails, true);
                        pendingScannedAddressDetails = null;
                    }
                } else if (result.status === 'new') {
                    document.getElementById('form_title').innerHTML = `<span class="text-primary">➕ ఇది కొత్త ఎంట్రీ (New Entry) కింద సేవ్ అవుతుంది. వివరాలు సరిచూసుకొని మార్పులు చేయవచ్చు.</span>`;
                    document.getElementById('action_type').value = 'insert';
                    document.getElementById('row_index').value = '';
                    buildFormFields(result.columns, result.data, aadhar, result.dropdown_data, result.auto_ifsc);

                    if (pendingScannedAadhaarDetails) {
                        applyAadhaarDetailsToForm(pendingScannedAadhaarDetails, false);
                        pendingScannedAadhaarDetails = null;
                    }
                    if (pendingScannedAddressDetails) {
                        applyAddressDetailsToForm(pendingScannedAddressDetails, true);
                        pendingScannedAddressDetails = null;
                    }
                } else {
                    alert(result.message || 'ఏదో లోపం జరిగింది!');
                    return;
                }

                document.getElementById('form_container').style.display = 'block';
                document.getElementById('form_container').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                alert('సర్వర్‌ను కనెక్ట్ చేయడంలో సమస్య ఏర్పడింది.');
            }
        }

        function parseDateParts(val) {
            if (!val) return { dd: '', mm: '', yyyy: '' };
            const s = String(val).trim().split(' ')[0];

            let m1 = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
            if (m1) {
                return {
                    yyyy: m1[1],
                    mm: m1[2].padStart(2, '0'),
                    dd: m1[3].padStart(2, '0')
                };
            }

            let m2 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
            if (m2) {
                return {
                    dd: m2[1].padStart(2, '0'),
                    mm: m2[2].padStart(2, '0'),
                    yyyy: m2[3]
                };
            }

            return { dd: '', mm: '', yyyy: '' };
        }

        function createDateDmyHtml(colName, val) {
            const safeKey = colName.replace(/[^a-zA-Z0-9]/g, '_');
            const parts = parseDateParts(val);
            const isMainDob = !/nominee/i.test(colName) && /(birth|dob)/i.test(colName);
            const onChangeHook = isMainDob ? `oninput="handleDmyInput('${safeKey}', true)"` : `oninput="handleDmyInput('${safeKey}', false)"`;

            return `
                <div class="dmy-group" data-dmy-col="${colName}" id="dmy_group_${safeKey}">
                    <input type="text" class="form-control dmy-input dmy-day" id="dmy_dd_${safeKey}" value="${parts.dd}" placeholder="DD" maxlength="2" ${onChangeHook}>
                    <span class="fw-bold text-muted">/</span>
                    <input type="text" class="form-control dmy-input dmy-month" id="dmy_mm_${safeKey}" value="${parts.mm}" placeholder="MM" maxlength="2" ${onChangeHook}>
                    <span class="fw-bold text-muted">/</span>
                    <input type="text" class="form-control dmy-input dmy-year" id="dmy_yyyy_${safeKey}" value="${parts.yyyy}" placeholder="YYYY" maxlength="4" ${onChangeHook}>
                </div>
                <div class="form-text text-muted" style="font-size: 0.72rem;">డే / మంత్ / ఇయర్ (ఉదా: 15 / 08 / 1990)</div>
            `;
        }

        function handleDmyInput(safeKey, isMainDob) {
            const ddEl = document.getElementById(`dmy_dd_${safeKey}`);
            const mmEl = document.getElementById(`dmy_mm_${safeKey}`);
            const yyyyEl = document.getElementById(`dmy_yyyy_${safeKey}`);

            if (ddEl) ddEl.value = ddEl.value.replace(/[^0-9]/g, '');
            if (mmEl) mmEl.value = mmEl.value.replace(/[^0-9]/g, '');
            if (yyyyEl) yyyyEl.value = yyyyEl.value.replace(/[^0-9]/g, '');

            if (isMainDob && yyyyEl && yyyyEl.value.length === 4) {
                const dobYear = parseInt(yyyyEl.value, 10);
                const currentYear = new Date().getFullYear();
                const ageInput = document.getElementById('age_input');
                if (ageInput && !isNaN(dobYear) && dobYear >= 1900 && dobYear <= currentYear) {
                    ageInput.value = currentYear - dobYear;
                }
            }
        }

        function readDmyAsIso(colName) {
            const safeKey = colName.replace(/[^a-zA-Z0-9]/g, '_');
            const ddRaw = (document.getElementById(`dmy_dd_${safeKey}`)?.value || '').trim();
            const mmRaw = (document.getElementById(`dmy_mm_${safeKey}`)?.value || '').trim();
            const yyyyRaw = (document.getElementById(`dmy_yyyy_${safeKey}`)?.value || '').trim();

            if (!ddRaw && !mmRaw && !yyyyRaw) {
                return { valid: true, isoValue: '', isEmpty: true };
            }

            const day = parseInt(ddRaw, 10);
            const month = parseInt(mmRaw, 10);
            const year = parseInt(yyyyRaw, 10);

            if (
                isNaN(day) || day < 1 || day > 31 ||
                isNaN(month) || month < 1 || month > 12 ||
                isNaN(year) || yyyyRaw.length !== 4 || year < 1900 || year > 2100
            ) {
                return { valid: false, isoValue: '', isEmpty: false };
            }

            const checkDate = new Date(year, month - 1, day);
            if (
                checkDate.getFullYear() !== year ||
                checkDate.getMonth() !== (month - 1) ||
                checkDate.getDate() !== day
            ) {
                return { valid: false, isoValue: '', isEmpty: false };
            }

            const ddStr = String(day).padStart(2, '0');
            const mmStr = String(month).padStart(2, '0');
            const yyyyStr = String(year).padStart(4, '0');

            return { valid: true, isoValue: `${yyyyStr}-${mmStr}-${ddStr}`, isEmpty: false };
        }

        function createFieldHtml(col, data, aadhar, dropdowns, autoIfsc) {
            let val = (data && data[col] !== undefined && data[col] !== null) ? data[col] : '';
            if (col === 'Aadhar Number') val = aadhar;
            if (col === 'IFSC code') {
                const selectedFile = document.getElementById('file_name_select').value;
                const mappedIfsc = autoIfsc || (selectedFile && fileIfscMap[selectedFile]) || '';
                if (mappedIfsc) val = mappedIfsc;
            }

            const districts = ['RAJANNA SIRCILLA', 'HYDERABAD', 'KARIMNAGAR', 'WARANGAL', 'NIZAMABAD', 'KHAMMAM', 'NALGONDA', 'MEDAK', 'ADILABAD', 'MAHABUBNAGAR', 'RANGAREDDY', 'SANGAREDDY', 'SIDDIPET', 'JAGTIAL', 'PEDDAPALLI', 'KAMARREDDY'];
            const mandals = {
                'RAJANNA SIRCILLA': ['SIRCILLA', 'YELLAREDDIPET', 'MUSTABAD', 'GAMBHIRAOPET', 'VEERANAPET', 'ELLANTHAKUNTA', 'BOINPALLE', 'THANGALLAPALLY', 'CHANDURTHY', 'RUDRANGI', 'MEERPET']
            };
            const wageOptions = [200, 300, 500, 600, 700, 800, 1000, 1200];

            let inputHtml = '';

            if (col === 'Profession') {
                let optionsList = dropdowns && dropdowns.professions ? [...dropdowns.professions] : ['POWER LOOM WEAVER'];
                if (!optionsList.includes('POWER LOOM WEAVER')) optionsList.unshift('POWER LOOM WEAVER');
                inputHtml = `<select class="form-select" name="${col}">`;
                optionsList.forEach(item => {
                    let sel = (val === item || (!val && item === 'POWER LOOM WEAVER')) ? 'selected' : '';
                    inputHtml += `<option value="${item}" ${sel}>${item}</option>`;
                });
                inputHtml += `</select>`;
            }
            else if (col === 'DISTRICT NAME') {
                inputHtml = `<select class="form-select" id="district_select" name="${col}">`;
                districts.forEach(d => {
                    let sel = (val === d || (!val && d === 'RAJANNA SIRCILLA')) ? 'selected' : '';
                    inputHtml += `<option value="${d}" ${sel}>${d}</option>`;
                });
                inputHtml += `</select>`;
            }
            else if (col === 'MANDAL NAME') {
                inputHtml = `<select class="form-select" id="mandal_select" name="${col}">`;
                let mList = mandals['RAJANNA SIRCILLA'] || ['SIRCILLA'];
                mList.forEach(m => {
                    let sel = (val === m || (!val && m === 'SIRCILLA')) ? 'selected' : '';
                    inputHtml += `<option value="${m}" ${sel}>${m}</option>`;
                });
                inputHtml += `</select>`;
            }
            else if (col === 'Caste') {
                if (!val) val = 'BC';
                inputHtml = `<input type="text" class="form-control" name="${col}" value="${val}">`;
            }
            else if (col === '8% Of Monthly Wages') {
                if (!val) val = 1200;
                inputHtml = `<select class="form-select" id="eight_percent_wages" name="${col}" onchange="updateMonthlyWages(this.value)">`;
                wageOptions.forEach(w => {
                    let sel = (Number(val) === Number(w)) ? 'selected' : '';
                    inputHtml += `<option value="${w}" ${sel}>${w}</option>`;
                });
                inputHtml += `</select>`;
            }
            else if (col === 'MONTHLY WAGES') {
                if (!val && data['8% Of Monthly Wages']) val = Number(data['8% Of Monthly Wages']) * 100 / 8;
                inputHtml = `<input type="text" class="form-control bg-light" id="monthly_wages_input" name="${col}" value="${val}" readonly>`;
            }
            else if (col === 'Date OF Birth' || col === 'Nominee DOB' || /(birth|dob)/i.test(col)) {
                inputHtml = createDateDmyHtml(col, val);
            }
            else if (col === 'Age') {
                inputHtml = `<input type="text" class="form-control bg-light" id="age_input" name="${col}" value="${val}" readonly>`;
            }
            else if (col === 'H.NO. Residentional H.No' || /residentional.*h\.?no|residential.*h\.?no/i.test(col)) {
                inputHtml = `
                    <div class="input-group">
                        <input type="text" class="form-control" name="${col}" value="${val}" placeholder="ఇంటి నంబర్...">
                        <button type="button" class="btn btn-outline-success scan-btn" onclick="triggerCameraScan(this.previousElementSibling, 'Residential Address')">📷 అడ్రస్ స్కాన్</button>
                    </div>
                `;
            }
            else if (['Village', 'Area', 'Unit Owner', 'H.NO. Unit H.No', 'Relation', 'VILLAGE NAME'].includes(col)) {
                let datalistId = `list_${col.replace(/[^a-zA-Z0-9]/g, '_')}`;
                let suggestions = [];
                if (col === 'Village' || col === 'VILLAGE NAME') suggestions = dropdowns.villages;
                else if (col === 'Area') suggestions = dropdowns.areas;
                else if (col === 'Unit Owner') suggestions = dropdowns.unit_owners;
                else if (col === 'H.NO. Unit H.No') suggestions = dropdowns.unit_hns;
                else if (col === 'Relation') suggestions = dropdowns.relations;

                inputHtml = `<input type="text" class="form-control" name="${col}" value="${val}" list="${datalistId}">`;
                inputHtml += `<datalist id="${datalistId}">`;
                if (suggestions) {
                    suggestions.forEach(s => {
                        inputHtml += `<option value="${s}">`;
                    });
                }
                inputHtml += `</datalist>`;
            }
            else if (SCANNABLE_FIELDS.includes(col)) {
                const maxLen = (col === 'Aadhar Number' || col === 'Nominee Aadhar') ? 12 : (col === 'Contact Number' ? 10 : 18);
                inputHtml = `
                    <div class="input-group">
                        <input type="text" class="form-control" name="${col}" value="${val}" maxlength="${maxLen}" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        <button type="button" class="btn btn-outline-primary scan-btn" onclick="triggerCameraScan(this.previousElementSibling, '${col}')">📷 స్కాన్</button>
                    </div>
                `;
            }
            else if (['BANK SENT', 'BANK_SNO', 'EMAIL ID', 'NAME OF CF', 'Bank Name', 'IFSC code', 'FILE NAME'].includes(col)) {
                inputHtml = `<input type="text" class="form-control bg-light" name="${col}" value="${val}" readonly>`;
            }
            else {
                inputHtml = `<input type="text" class="form-control" name="${col}" value="${val}">`;
            }

            return `
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold text-secondary small">${col}</label>
                    ${inputHtml}
                </div>
            `;
        }

        function buildFormFields(columns, data, aadhar, dropdowns, autoIfsc = '') {
            const grid = document.getElementById('form_fields_grid');
            grid.innerHTML = '';

            const sections = [
                {
                    id: 'aadhar_section',
                    title: '🪪 ఆధార్ కార్డ్ డేటా సెక్షన్ (Aadhaar Card Data Section)',
                    headerClass: 'text-primary',
                    fields: [
                        'Name Of Benificiary', 'Father Name', 'Date OF Birth', 'Age',
                        'Aadhar Number',
                        'DISTRICT NAME', 'MANDAL NAME', 'VILLAGE NAME', 'H.NO. Residentional H.No'
                    ]
                },
                {
                    id: 'working_area_section',
                    title: '🏭 వర్కింగ్ ఏరియా సెక్షన్ (Working Area Section)',
                    headerClass: 'text-success',
                    fields: [
                        'Caste', 'Profession', 'Contact Number', 'Village', 'Area', 'H.NO. Unit H.No', 'Unit Owner',
                        'GEO TAG NUMBER', '8% Of Monthly Wages', 'MONTHLY WAGES', 'NAME OF CF'
                    ]
                },
                {
                    id: 'bank_section',
                    title: '🏦 బ్యాంక్ సెక్షన్ (Bank Section)',
                    headerClass: 'text-dark',
                    fields: [
                        'FILE NAME', 'Bank Name', 'IFSC code', 'Bank Account Number',
                        'EMAIL ID', 'BANK_SNO', 'SNO', 'BANK SENT',
                        'RD 1', 'RD 1 Closing Balance', 'BANK_REMARKS',
                        'RD ACCOUNT_2 (Govt. Contribution)', 'RD 2', 'RD2_balance'
                    ]
                },
                {
                    id: 'nominee_section',
                    title: '👨‍👩‍👧 నామినీ సెక్షన్ (Nominee Section)',
                    headerClass: 'text-info',
                    fields: [
                        'Nominee Name', 'Relation', 'Nominee Aadhar', 'Nominee DOB'
                    ]
                }
            ];

            const assignedFields = new Set();

            sections.forEach(sec => {
                const presentFields = sec.fields.filter(f => columns.includes(f));
                if (presentFields.length === 0) return;

                let secHtml = `
                    <div class="section-card" id="${sec.id}">
                        <div class="section-header ${sec.headerClass}">${sec.title}</div>
                        <div class="row">
                `;

                presentFields.forEach(col => {
                    assignedFields.add(col);
                    secHtml += createFieldHtml(col, data, aadhar, dropdowns, autoIfsc);
                });

                secHtml += `</div></div>`;
                grid.insertAdjacentHTML('beforeend', secHtml);
            });

            const extraFields = columns.filter(col => !assignedFields.has(col));
            if (extraFields.length > 0) {
                let extraHtml = `
                    <div class="section-card" id="other_section">
                        <div class="section-header text-secondary">📌 ఇతర వివరాలు (Other Details)</div>
                        <div class="row">
                `;
                extraFields.forEach(col => {
                    extraHtml += createFieldHtml(col, data, aadhar, dropdowns, autoIfsc);
                });
                extraHtml += `</div></div>`;
                grid.insertAdjacentHTML('beforeend', extraHtml);
            }

            document.getElementById('form_container').style.display = 'block';
        }

        function updateMonthlyWages(val) {
            const wages = Number(val);
            const monthlyWagesInput = document.getElementById('monthly_wages_input');
            if (monthlyWagesInput && !isNaN(wages)) {
                monthlyWagesInput.value = Math.round((wages * 100) / 8);
            }
        }

        async function saveBeneficiaryData() {
            const form = document.getElementById('dynamic_beneficiary_form');
            
            const contactInput = form.querySelector('input[name="Contact Number"]');
            if (contactInput) {
                const contactVal = contactInput.value.trim();
                if (contactVal && (contactVal.length !== 10 || !/^\d+$/.test(contactVal))) {
                    alert('దయచేసి సరైన 10 అంకెల మొబైల్ నంబర్ ఎంటర్ చేయండి!');
                    contactInput.focus();
                    return;
                }
            }

            const formData = {};
            const inputs = form.querySelectorAll('input, select');
            
            inputs.forEach(input => {
                if (input.name && input.name !== 'action_type' && input.name !== 'row_index') {
                    formData[input.name] = input.value;
                }
            });

            const dmyGroups = form.querySelectorAll('[data-dmy-col]');
            for (const grp of dmyGroups) {
                const colName = grp.getAttribute('data-dmy-col');
                const parsed = readDmyAsIso(colName);
                if (!parsed.valid) {
                    alert(`${colName} కోసం సరైన డే / మంత్ / ఇయర్ (DD / MM / YYYY) తేదీని ఎంటర్ చేయండి!`);
                    return;
                }
                formData[colName] = parsed.isoValue;
            }

            const payload = {
                action_type: document.getElementById('action_type').value,
                row_index: document.getElementById('row_index').value,
                form_data: formData
            };

            try {
                const response = await fetch('/cf/save-beneficiary', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                alert(result.message);
                if (result.status === 'success') {
                    location.reload();
                }
            } catch (error) {
                alert('డేటా సేవ్ చేయడంలో సమస్య ఏర్పడింది.');
            }
        }

        async function cfLogout() {
            await fetch('/cf/logout', {method: 'POST'});
            window.location.href = '/cf/login';
        }
    </script>
