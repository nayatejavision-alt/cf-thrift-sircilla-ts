<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>అడ్మిన్ లాగిన్ - త్రిఫ్టు పథకము</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">🛡️ అడ్మిన్ పోర్టల్</h3>
            <p class="text-muted small">చేనేత మరియు జౌళి శాఖ - త్రిఫ్టు పథకం</p>
        </div>

        <div id="error-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-semibold">యూజర్‌నేమ్ (Username)</label>
                <input type="text" id="username" class="form-control" required placeholder="యూజర్‌నేమ్ ఎంటర్ చేయండి">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">పాస్‌వర్డ్ (Password)</label>
                <input type="password" id="password" class="form-control" required placeholder="పాస్‌వర్డ్ ఎంటర్ చేయండి">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                లాగిన్ అవ్వండి (Login)
            </button>
        </form>
    </div>

    <script>
        async function handleAdminLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('error-alert');

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    window.location.href = '/admin/dashboard';
                } else {
                    errorAlert.textContent = result.message;
                    errorAlert.classList.remove('d-none');
                }
            } catch (err) {
                errorAlert.textContent = "నెట్‌వర్క్ లోపం సంభవించింది.";
                errorAlert.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
