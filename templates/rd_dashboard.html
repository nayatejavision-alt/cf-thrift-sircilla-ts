<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <title>డిపాజిట్ సారాంశం</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; }
        .metric { background: #e3f2fd; padding: 20px; border-radius: 8px; font-size: 20px; font-weight: bold; margin-bottom: 20px; color: #0d47a1; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; margin-bottom: 30px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .btn { background-color: #6c757d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; }
        .btn:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 టర్మ్ & రికరింగ్ డిపాజిట్స్ డాష్‌బోర్డ్</h2>
        <div class="metric">మొత్తం డిపాజిట్ బ్యాలెన్స్: ₹ {{ total_balance }}</div>

        <h3>సెక్షన్ల వారీగా వివరాలు</h3>
        <div>{{ summary_table | safe }}</div>

        <h3>అన్ని ఖాతాల వివరాలు</h3>
        <div style="max-height: 400px; overflow-y: scroll;">
            {{ data_table | safe }}
        </div>

        <br>
        <a href="/" class="btn">మరొక ఫైల్ అప్‌లోడ్ చేయండి</a>
    </div>
</body>
</html>
