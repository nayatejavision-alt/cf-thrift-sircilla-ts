<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <title>టర్మ్ & రికరింగ్ డిపాజిట్స్ డాష్‌బోర్డ్</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 50px; text-align: center; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        input[type=file] { margin: 20px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        input[type=submit] { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        input[type=submit]:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏦 టర్మ్ & రికరింగ్ డిపాజిట్స్ డాష్‌బోర్డ్</h2>
        <p>దయచేసి బ్యాంకు టెక్స్ట్ ఫైల్‌ను అప్‌లోడ్ చేయండి</p>
        <form action="/rd/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".txt" required><br>
            <input type="submit" value="డాష్‌బోర్డ్ వీక్షించండి">
        </form>
    </div>
</body>
</html>
