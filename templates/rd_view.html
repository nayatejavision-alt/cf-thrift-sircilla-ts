<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <title>RD File Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .container { max-width: 500px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="file"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .error-msg { color: red; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Term Deposit & .PRN File Comparison</h2>

        <!-- Flash messages చూపించడానికి -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="error-msg">
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <!-- File Upload Form -->
        <form action="{{ url_for('rd_bp.compare_files') }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file1">1. Term Deposit File (Excel/CSV):</label>
                <input type="file" id="file1" name="file1" required>
            </div>

            <div class="form-group">
                <label for="file2">2. .PRN File:</label>
                <input type="file" id="file2" name="file2" required>
            </div>

            <button type="submit">Compare Files</button>
        </form>
    </div>

</body>
</html>
